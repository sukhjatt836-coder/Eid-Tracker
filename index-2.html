  #authGate .field-with-icon input { border:none; padding:0; flex:1; border-radius:0; margin:0; }
  #authGate .field-with-icon input:focus { outline:none; }

  /* --- PWA "new version available" banner --- */

    font-family: Arial, sans-serif; font-size: 14px;

  <div class="card" id="card"></div>

<div id="root" style="display:none"><div id="boot-msg">Loading EID Tracker…</div></div>

<div id="fatalErrorBanner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99999;background:#b00020;color:#fff;padding:14px 16px;font-family:Arial,sans-serif;font-size:13px;white-space:pre-wrap;max-height:60vh;overflow:auto;"></div>
<script>
  // Catches ANY uncaught JS error (from either the plain auth-gate script
  // or the React app) and shows it right on screen. Without this, a crash
  // in a mobile browser (no dev console) just looks like a blank/frozen
  // page with no way to tell what went wrong.
  window.addEventListener('error', function (e) {
    var el = document.getElementById('fatalErrorBanner');
    if (!el) return;
    el.style.display = 'block';
    el.textContent = 'App error: ' + (e.message || 'Unknown error') +
      (e.filename ? ('\nLine ' + e.lineno + ': ' + e.filename.split('/').pop()) : '') +
      '\n\nTap to reload.';
    el.onclick = function () { window.location.reload(); };
  });
  window.addEventListener('unhandledrejection', function (e) {
    var el = document.getElementById('fatalErrorBanner');
    if (!el) return;
    el.style.display = 'block';
    el.textContent = 'App error (promise): ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) + '\n\nTap to reload.';
    el.onclick = function () { window.location.reload(); };
  });
</script>

<script>
  // ---------------------------------------------------------------------
  // FIRESTORE SETUP (cross-device accounts + single-device login)
  //
  // >>> ONE-TIME SETUP YOU NEED TO DO (free) <<<
  // 1. Go to https://console.firebase.google.com → "Add project" → give it
  //    any name → you can skip Google Analytics.
  // 2. In the project, open "Build" → "Firestore Database" → "Create
  //    database" → pick a region close to India → start in
  //    **production mode**.
  // 3. In Firestore → "Rules" tab, paste this and click Publish (locks the
  //    database to only this app's key/value shape — still no login
  //    system on the DB side, so keep this app's own PIN check as the
  //    real gatekeeper):
  //      rules_version = '2';
  //      service cloud.firestore {
  //        match /databases/{database}/documents {
  //          match /kv/{docId} {
  //            allow read, write: if true;
  //          }
  //        }
  //      }
  // 4. Back in the project, click the gear icon → "Project settings" →
  //    scroll to "Your apps" → click the </> (Web) icon → register an app
  //    (any nickname) → it shows a `firebaseConfig` object. Copy those
  //    values into the object right below this comment.
  //
  // Until you paste real values here, the app keeps working exactly as
  // before (device-local storage only) — it just won't sync across
  // devices or enforce single-device login.
  // ---------------------------------------------------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyD49NNklvjaf2vSepUo8xcKJ665mCdFlPs",
    authDomain: "eid-tracker.firebaseapp.com",
    projectId: "eid-tracker",
    storageBucket: "eid-tracker.firebasestorage.app",
    messagingSenderId: "465886239349",
    appId: "1:465886239349:web:9aae3bda7c4d81c641b63c",
  };

  let cloudDB = null;
  try {
    if (firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('PASTE_') !== 0 && window.firebase) {
      firebase.initializeApp(firebaseConfig);
      cloudDB = firebase.firestore();
    }
  } catch (e) {
    console.warn('Firebase not configured / failed to initialize — running in local-only (single-device) mode.', e);
    cloudDB = null;
  }
  window.__cloudReady = !!cloudDB;

  async function cloudGet(key) {
    if (!cloudDB) return null;
    try {
      const snap = await cloudDB.collection('kv').doc(key).get();
      return snap.exists ? snap.data().v : null;
    } catch (e) { console.warn('cloudGet failed', key, e); return null; }
  }
  async function cloudSet(key, value) {
    if (!cloudDB) return false;
    try {
      await cloudDB.collection('kv').doc(key).set({ v: value, updatedAt: Date.now() });
      return true;
    } catch (e) { console.warn('cloudSet failed', key, e); return false; }
  }
  async function cloudDeleteKey(key) {
    if (!cloudDB) return false;
    try { await cloudDB.collection('kv').doc(key).delete(); return true; }
    catch (e) { console.warn('cloudDelete failed', key, e); return false; }
  }
  async function cloudListPrefix(prefix) {
    if (!cloudDB) return [];
    try {
      const q = await cloudDB.collection('kv')
        .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
        .where(firebase.firestore.FieldPath.documentId(), '<', prefix + '\uf8ff')
        .get();
      return q.docs.map((d) => d.id);
    } catch (e) { console.warn('cloudListPrefix failed', prefix, e); return []; }
  }
  window.__cloudGet = cloudGet;
  window.__cloudSet = cloudSet;
  window.__cloudDelete = cloudDeleteKey;
  window.__cloudListPrefix = cloudListPrefix;
</script>

<script>
  // ---------------------------------------------------------------------
  // LOGIN / REGISTER / LOGOUT GATE
  // Plain JS, independent of React and of the app's own storage. Uses its
  // own localStorage keys (eidtracker-offline-v1:...) so it never collides
  // with the app's per-account data below.
  //
  // Auth model: mobile number + a 4-digit PIN the person sets at
  // registration. No SMS/OTP gateway required.
  //
  // Cross-device behaviour (only active once Firebase is configured
  // above): the account profile lives in Firestore, so the SAME mobile
  // number always resolves to the SAME farm account no matter which
  // phone opens the app — registering that number a second time on
  // another phone is rejected with "already registered", and logging in
  // pulls the one real account down to that device. Every fresh login or
  // registration also "claims" the account for that device; any other
  // device still signed in gets signed out automatically the moment it's
  // next online (single-device login).
  // ---------------------------------------------------------------------
  const AUTH_APP_PREFIX = 'eidtracker-offline-v1:';
  const authClean = (m) => String(m || '').replace(/\D/g, '');
  const authKey = (type, m) => AUTH_APP_PREFIX + type + ':' + authClean(m);
  const authDeviceSessionKey = (m) => authKey('devicesession', m);

  // --- IndexedDB backup for auth data (profile + PIN) --------------------
  // Local safety net in addition to the cloud copy: if this device is
  // briefly offline, or Firebase isn't configured at all, the app still
  // works from this local cache.
  const AUTH_DB_NAME = 'goat-eid-tracker-db';
  const AUTH_DB_STORE = 'kv';
  const authOpenDB = () => new Promise((resolve, reject) => {
    try {
      const req = indexedDB.open(AUTH_DB_NAME, 1);
      req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(AUTH_DB_STORE)) req.result.createObjectStore(AUTH_DB_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    } catch (e) { reject(e); }
  });
  const authIdbSet = async (key, value) => {
    const db = await authOpenDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(AUTH_DB_STORE, 'readwrite');
      tx.objectStore(AUTH_DB_STORE).put(value, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  };
  const authIdbGet = async (key) => {
    const db = await authOpenDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(AUTH_DB_STORE, 'readonly');
      const req = tx.objectStore(AUTH_DB_STORE).get(key);
      req.onsuccess = () => resolve(req.result == null ? null : req.result);
      req.onerror = () => reject(req.error);
    });
  };

  const authRead = (type, m, def) => {
    try {
      const v = localStorage.getItem(authKey(type, m));
      return v ? JSON.parse(v) : def;
    } catch { return def; }
  };
  // Writes to the local cache (localStorage + IndexedDB) AND, if
  // configured, mirrors to Firestore in the background so other devices
  // see the change next time they read.
  const authWrite = (type, m, v) => {
    const key = authKey(type, m);
    const json = JSON.stringify(v);
    try { localStorage.setItem(key, json); } catch {}
    authIdbSet(key, json).catch(() => {});
    if (window.__cloudReady) cloudSet(key, json).catch(() => {});
    return true;
  };
  const authRecover = async (type, m) => {
    const key = authKey(type, m);
    try {
      if (localStorage.getItem(key) != null) return null;
      const backup = await authIdbGet(key);
      if (backup == null) return null;
      localStorage.setItem(key, backup);
      return JSON.parse(backup);
    } catch { return null; }
  };

  // Synchronous, LOCAL-ONLY lookup — used for "am I already signed in on
  // this device" checks that must resolve instantly on page load.
  const authProfile = (m) => authRead('profile', m, null);

  // Asynchronous, CLOUD-FIRST lookup — this is the one that actually
  // decides "does this account exist" during login/registration, so the
  // same number can't silently become two different accounts on two
  // phones. Falls back to the local cache if the cloud is unreachable.
  async function cloudProfile(m) {
    const key = authKey('profile', m);
    if (window.__cloudReady) {
      const json = await cloudGet(key);
      if (json) return JSON.parse(json);
    }
    return authProfile(m);
  }

  let authSession = authClean(localStorage.getItem(AUTH_APP_PREFIX + 'session') || '');
  let authIsNewUser = false;
  let authKickedMessage = '';
  let myDeviceSessionId = null;
  let sessionWatchUnsub = null;

  function authSetSession(m) {
    authSession = authClean(m);
    if (authSession) localStorage.setItem(AUTH_APP_PREFIX + 'session', authSession);
    else localStorage.removeItem(AUTH_APP_PREFIX + 'session');
    authRender();
  }

  // Marks this device as the one true active session for the account
  // (only meaningful once Firebase is configured) and starts watching
  // for a takeover by another device.
  async function claimDeviceSession(mobile, profile) {
    if (!window.__cloudReady) return;
    myDeviceSessionId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (String(Date.now()) + Math.random());
    try { localStorage.setItem(authDeviceSessionKey(mobile), myDeviceSessionId); } catch {}
    const next = { ...profile, activeSessionId: myDeviceSessionId };
    authWrite('profile', mobile, next);
    await cloudSet(authKey('profile', mobile), JSON.stringify(next));
    watchSessionForKick(mobile, myDeviceSessionId);
  }

  // Called on a fresh page load when a session was already saved on this
  // device — resumes watching using the session id claimed earlier,
  // WITHOUT re-claiming (a page refresh should never kick other devices).
  async function resumeDeviceSession(mobile) {
    if (!window.__cloudReady) return;
    let sid = null;
    try { sid = localStorage.getItem(authDeviceSessionKey(mobile)); } catch {}
    if (!sid) return;
    myDeviceSessionId = sid;
    const p = await cloudProfile(mobile);
    if (p && p.activeSessionId && p.activeSessionId !== sid) {
      authKickedMessage = 'You were logged out because this account was opened on another device.';
      authLogout();
      return;
    }
    watchSessionForKick(mobile, sid);
  }

  function watchSessionForKick(mobile, mySessionId) {
    if (!window.__cloudReady) return;
    if (sessionWatchUnsub) { sessionWatchUnsub(); sessionWatchUnsub = null; }
    const key = authKey('profile', mobile);
    sessionWatchUnsub = cloudDB.collection('kv').doc(key).onSnapshot((snap) => {
      if (!snap.exists) return;
      try {
        const data = JSON.parse(snap.data().v);
        if (data.activeSessionId && data.activeSessionId !== mySessionId) {
          if (sessionWatchUnsub) { sessionWatchUnsub(); sessionWatchUnsub = null; }
          authKickedMessage = 'You were logged out because this account was opened on another device.';
          authLogout();
        }
      } catch {}
    });
  }

  async function authLogin(mobile, pin) {
    let p = await cloudProfile(mobile);
    if (!p) {
      return { ok: false, error: 'No account found for this number. Please register first.' };
    }
    if (String(p.pin) !== String(pin)) {
      return { ok: false, error: 'Incorrect PIN.' };
    }
    authWrite('profile', mobile, p);
    await claimDeviceSession(mobile, p);
    authSetSession(mobile);
    return { ok: true };
  }

  async function authRegister(mobile, details) {
    const existing = await cloudProfile(mobile);
    if (existing) {
      return { ok: false, error: 'This number is already registered. Please login.' };
    }
    const profile = { ...details, mobile, registeredAt: new Date().toISOString() };
    authWrite('profile', mobile, profile);
    await claimDeviceSession(mobile, profile);
    authSetSession(mobile);
    return { ok: true };
  }

  function authLogout() {
    if (sessionWatchUnsub) { sessionWatchUnsub(); sessionWatchUnsub = null; }
    myDeviceSessionId = null;
    authSetSession('');
  }

  // ---- Bridge functions used by the React "Account details" screen ----
  window.__authUpdateProfileFields = function (mobile, updates) {
    const p = authProfile(mobile);
    if (!p) return { ok: false, error: 'Account not found.' };
    const next = { ...p, ...updates };
    authWrite('profile', mobile, next);
    return { ok: true, profile: next };
  };

  window.__authCheckPin = function (mobile, pin) {
    const p = authProfile(mobile);
    if (!p) return { ok: false, error: 'Account not found.' };
    if (String(p.pin) !== String(pin)) return { ok: false, error: 'Incorrect PIN.' };
    return { ok: true };
  };

  window.__authValidateNewMobile = function (newMobile) {
    const clean = authClean(newMobile);
    if (clean.length !== 10) return { ok: false, error: 'Enter a valid 10-digit mobile number.' };
    if (authProfile(clean)) return { ok: false, error: 'This number is already registered on another account.' };
    return { ok: true, newMobile: clean };
  };

  window.__authFinishMobileChange = function (oldMobile, newMobile, updatedProfile) {
    authWrite('profile', newMobile, { ...updatedProfile, mobile: newMobile });
    authSetSession(newMobile);
    claimDeviceSession(newMobile, { ...updatedProfile, mobile: newMobile }).catch(() => {});
    return { ok: true };
  };

  window.__authChangePin = function (mobile, currentPin, newPin) {
    const p = authProfile(mobile);
    if (!p) return { ok: false, error: 'Account not found.' };
    if (String(p.pin) !== String(currentPin)) return { ok: false, error: 'Current PIN is incorrect.' };
    if (!/^\d{4}$/.test(String(newPin))) return { ok: false, error: 'New PIN must be exactly 4 digits.' };
    authWrite('profile', mobile, { ...p, pin: newPin });
    return { ok: true };
  };

  let authMode = 'landing'; // 'landing' | 'login' | 'register'
  let authPendingError = '';

  const BRAND_LOGO = `<div class="logo">▦</div>
    <div class="brand-title">Farm Tracker</div>
    <div class="brand-sub">Electronic Livestock System</div>`;

  function authRender() {
    const gate = document.getElementById('authGate');
    const appRoot = document.getElementById('root');

    if (authSession && authProfile(authSession)) {
      gate.style.display = 'none';
      appRoot.style.display = '';
      const p = authProfile(authSession);
      if (window.__mountGoatTracker) {
        window.__mountGoatTracker(authSession, p.farm, p.owner, p.email, () => {
          authLogout();
          authIsNewUser = false;
          authMode = 'landing';
        }, authIsNewUser);
      }
      return;
    }

    gate.style.display = '';
    appRoot.style.display = 'none';
    if (window.__unmountGoatTracker) window.__unmountGoatTracker();

    const card = document.getElementById('card');

    if (authMode === 'landing') {
      const kicked = authKickedMessage;
      authKickedMessage = '';
      card.innerHTML = `
        ${BRAND_LOGO}
        ${kicked ? `<div class="msg error">${kicked}</div>` : ''}
        <div class="brand-tagline">Manage every animal on your farm — goats, cows, buffalo, sheep &amp; poultry — with EID tags, production logs, breeding &amp; finances.</div>
        <button class="primary" id="goRegister">Register Farm &amp; Order EID Tags</button>
        <button class="ghost" id="goLogin">Existing Owner Login (Password)</button>
        <div class="muted">${window.__cloudReady ? 'Synced securely across your devices' : '100% Free & Secure · Your data stays on this device'}</div>
      `;
      document.getElementById('goRegister').onclick = () => { authMode = 'register'; authRender(); };
      document.getElementById('goLogin').onclick = () => { authMode = 'login'; authRender(); };
      return;
    }

    card.innerHTML = `
      ${BRAND_LOGO}
      <div class="back-row">
        <button class="back-arrow" id="backBtn">←</button>
        <div class="titles">
          <div class="t1">${authMode === 'login' ? 'Owner Login' : 'Register Farm'}</div>
          <div class="t2">${authMode === 'login' ? 'Enter your mobile number and PIN' : 'Create your farm account'}</div>
        </div>
      </div>
      <div id="msg"></div>
      <div id="form"></div>
    `;
    document.getElementById('backBtn').onclick = () => { authMode = 'landing'; authRender(); };

    const msg = document.getElementById('msg');
    if (authPendingError) {
      msg.innerHTML = `<div class="msg error">${authPendingError}</div>`;
      authPendingError = '';
    }

    const form = document.getElementById('form');
    if (authMode === 'login') {
      form.innerHTML = `
        <label>Mobile number</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <span style="padding:12px 14px;background:#F4EFE1;border-radius:999px;font-weight:700;">+91</span>
          <input id="mobile" inputmode="numeric" maxlength="10" placeholder="10-digit mobile" style="flex:1;">
        </div>
        <label>4-digit login PIN</label>
        <input id="pin" inputmode="numeric" maxlength="4" placeholder="1234">
        <button class="primary" id="submitBtn">Login Securely</button>
        <div class="muted">New to Farm Tracker? <button class="link-btn" id="toRegister">Register Now</button></div>
      `;
      document.getElementById('toRegister').onclick = () => { authMode = 'register'; authRender(); };
      document.getElementById('submitBtn').onclick = async () => {
        const cleanMobile = authClean(document.getElementById('mobile').value);
        const pin = document.getElementById('pin').value.trim();
        if (cleanMobile.length !== 10) { authPendingError = 'Enter a valid 10-digit mobile number.'; authRender(); return; }
        if (!/^\d{4}$/.test(pin)) { authPendingError = 'Enter your 4-digit PIN.'; authRender(); return; }
        authIsNewUser = false;
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.textContent = 'Logging in…';
        const result = await authLogin(cleanMobile, pin);
        if (!result.ok) { authPendingError = result.error; authRender(); }
      };
    } else {
      form.innerHTML = `
        <label>Farm name</label>
        <input id="farm" placeholder="My Farm">
        <label>Owner name</label>
        <input id="owner" placeholder="Owner name">
        <label>Mobile number</label>

<script>
  // ---------------------------------------------------------------------
  // STORAGE SHIM
  // The app was built for Claude's artifact sandbox, which provides a
  // window.storage API automatically. Here we recreate the same
  // get/set/delete/list interface for standalone deployment.
  //
  // IMPORTANT: every write goes to BOTH localStorage AND IndexedDB
  // (best-effort, failures on one don't block the other). Every read
  // checks both and returns whichever has the data, self-healing the
  // other side if only one had it. This redundancy exists because a
  // single storage mechanism can be silently cleared by the browser
  // (low-storage eviction, "Clear browsing data", private mode quirks)
  // — keeping two independent copies means one surviving is enough to
  // recover a farm's full herd/finance/order history.
  // ---------------------------------------------------------------------
  if (!window.storage) {
    // Ask the browser not to silently evict this site's storage under
    // storage pressure. Not supported everywhere, and even where it is,
    // the browser can still say no — so this reduces the risk of data
    // loss but is not a guarantee, which is exactly why the dual-write
    // below exists as the real safety net.
    try { navigator.storage?.persist?.(); } catch {}

    const DB_NAME = 'goat-eid-tracker-db';
    const STORE = 'kv';
    const openDB = () => new Promise((resolve, reject) => {
      try {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      } catch (e) { reject(e); }
    });
    const idbGet = async (key) => {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).get(key);
        req.onsuccess = () => resolve(req.result == null ? null : { key, value: req.result, shared: false });
        req.onerror = () => reject(req.error);
      });
    };
    const idbSet = async (key, value) => {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(value, key);
        tx.oncomplete = () => resolve({ key, value, shared: false });
        tx.onerror = () => reject(tx.error);
      });
    };
    const idbDelete = async (key) => {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(key);
        tx.oncomplete = () => resolve({ key, deleted: true, shared: false });
        tx.onerror = () => reject(tx.error);
      });
    };
    const idbList = async (prefix='') => {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).getAllKeys();
        req.onsuccess = () => resolve({ keys: req.result.filter(k => !prefix || String(k).startsWith(prefix)), prefix, shared: false });
        req.onerror = () => reject(req.error);
      });
    };
    const lsGet = (key) => {
      try { const raw = localStorage.getItem(key); return raw === null ? null : { key, value: raw, shared: false }; }
      catch { return null; }
    };
    const lsSet = (key, value) => {
      try { localStorage.setItem(key, value); return true; } catch { return false; }
    };
    const lsDelete = (key) => {
      try { localStorage.removeItem(key); return true; } catch { return false; }
    };
    const lsList = (prefix) => {
      try { return Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix)); } catch { return []; }
    };

    window.storage = {
      async get(key) {
        // Cloud is authoritative once configured — this is what makes a
        // farm's animals/orders/finances show up on a second device after
        // logging in there, instead of looking empty.
        if (window.__cloudReady) {
          const cloudVal = await window.__cloudGet(key);
          if (cloudVal != null) {
            lsSet(key, cloudVal);
            try { await idbSet(key, cloudVal); } catch {}
            return { key, value: cloudVal, shared: false };
          }
        }
        // No cloud value (not configured, offline, or genuinely empty) —
        // fall back to whichever local copy exists, and opportunistically
        // push it up once the cloud is reachable so it isn't stuck local.
        const ls = lsGet(key);
        let idb = null;
        try { idb = await idbGet(key); } catch { idb = null; }
        let result = null;
        if (ls && idb) result = ls;
        else if (ls && !idb) { try { await idbSet(key, ls.value); } catch {} result = ls; }
        else if (!ls && idb) { lsSet(key, idb.value); result = idb; }
        if (result && window.__cloudReady) window.__cloudSet(key, result.value).catch(() => {});
        return result;
      },
      async set(key, value) {
        const lsOk = lsSet(key, value);
        let idbOk = true;
        try { await idbSet(key, value); } catch { idbOk = false; }
        if (window.__cloudReady) window.__cloudSet(key, value).catch(() => {});
        if (!lsOk && !idbOk) return null;
        return { key, value, shared: false };
      },
      async delete(key) {
        const lsOk = lsDelete(key);
        let idbOk = true;
        try { await idbDelete(key); } catch { idbOk = false; }
        if (window.__cloudReady) window.__cloudDelete(key).catch(() => {});
        if (!lsOk && !idbOk) return null;
        return { key, deleted: true, shared: false };
      },
      async list(prefix) {
        if (window.__cloudReady) {
          const cloudKeys = await window.__cloudListPrefix(prefix || '');
          if (cloudKeys.length) return { keys: cloudKeys, prefix, shared: false };
        }
        const lsKeys = lsList(prefix);
        let idbKeys = [];
        try { idbKeys = (await idbList(prefix || '')).keys; } catch { idbKeys = []; }
        const merged = Array.from(new Set([...lsKeys, ...idbKeys]));
        return { keys: merged, prefix, shared: false };
      },
    };
  }

  const { useState, useEffect, useCallback, useRef } = React;
</script>

function monthsToDate(dob, months) {
  const d = new Date(dob);

// For a given goat, returns the vaccine schedule with computed status: upcoming, due, overdue, or done-recently.
function greetingForHour(h) {

  if (h >= 12 && h < 17) return 'Good afternoon';
  if (h >= 17 && h < 21) return 'Good evening';

}

      if (v.status === 'overdue' || v.status === 'due-soon') count++;

  });

}
function computeVaccineStatuses(goat) {
  const today = new Date();
  return VACCINE_SCHEDULE.map((v) => {
    const doses = goat.health
      .filter((h) => h.type === 'vaccination' && h.vaccine === v.id)
      .sort((a, b) => b.date.localeCompare(a.date));
    const lastDose = doses[0];
    let dueDate;
    if (lastDose) {
      dueDate = new Date(lastDose.date);
      dueDate.setDate(dueDate.getDate() + v.boosterIntervalDays);
    } else if (goat.dob) {
      dueDate = monthsToDate(goat.dob, v.firstDoseAgeMonths);
    } else {

    let status = 'unknown';
    let daysDiff = null;
    if (dueDate) {
      daysDiff = Math.round((dueDate - today) / 86400000);
      if (daysDiff < 0) status = 'overdue';
      else if (daysDiff <= 21) status = 'due-soon';
      else status = 'scheduled';
    }

}

// Simulated shipment progress for a tag order, based on elapsed time since
// it was placed. This is a frontend-only demo build with no real courier
// integration, so delivery status advances automatically over a few days.
const TAG_ORDER_STEPS = ['Order placed', 'Packed', 'Shipped', 'Out for delivery', 'Delivered'];
function getTagOrderProgress(order) {
  const placed = new Date(order.placedAt).getTime();
  const hoursElapsed = (Date.now() - placed) / (1000 * 60 * 60);
  const stepIndex = Math.min(TAG_ORDER_STEPS.length - 1, Math.floor(hoursElapsed / 24));
  const estDelivery = new Date(placed + 4 * 24 * 60 * 60 * 1000);
  return {
    stepIndex,
    stepLabel: TAG_ORDER_STEPS[stepIndex],
    delivered: stepIndex === TAG_ORDER_STEPS.length - 1,
    estDelivery,
  };
}
function generateTrackingId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = 'TAG';
  for (let i = 0; i < 8; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function dateToISODate(d) {
  return new Date(d).toISOString().slice(0, 10);
}

function addDays(dateString, days) {
  const d = new Date(dateString);
  d.setDate(d.getDate() + days);
  return dateToISODate(d);
}

function expectedKiddingDate(dateString) {
  return dateString ? addDays(dateString, 150) : '';
}

function currentMonthKey() {
  return new Date().toISOString().slice(0, 7);
}

function money(value) {
  const n = Number(value) || 0;
  return `₹${n.toLocaleString('en-IN', { maximumFractionDigits: 2 })}`;
}

function goatWeightGain(goat) {
  const weights = [...(goat.weights || [])].sort((a, b) => a.date.localeCompare(b.date));
  if (weights.length < 2) return 0;
  return Math.max(0, Number(weights[weights.length - 1].kg) - Number(weights[0].kg));
}

function goatFeedCost(goat) {
  return (goat.feed || []).reduce((sum, f) => sum + (Number(f.cost) || 0), 0);
}

function feedCostPerKgGain(goat) {
  const gain = goatWeightGain(goat);
  const cost = goatFeedCost(goat);
  return gain > 0 ? cost / gain : null;
}

function performanceVerdict(goat) {
  const gain = goatWeightGain(goat);
  const costPerGain = feedCostPerKgGain(goat);
  const milk = (goat.milk || []).reduce((s, m) => s + (Number(m.totalLitres) || 0), 0);
  const kiddings = (goat.breeding || []).filter(b => b.type === 'kidded').length;

  if (goat.status !== 'active') return { label: goat.status === 'sold' ? 'SOLD' : goat.status.toUpperCase(), tone: 'neutral', reason: 'Record is not currently active.' };
  if (goat.gender === 'female' && (kiddings > 0 || milk >= 30) && (costPerGain === null || costPerGain <= 180)) {
    return { label: 'KEEP', tone: 'good', reason: `Good breeding/milk activity${gain ? ` with ${gain.toFixed(1)} kg recorded gain` : ''}.` };
  }
  if (gain >= 10 && (costPerGain === null || costPerGain <= 180)) {
    return { label: 'KEEP', tone: 'good', reason: `${gain.toFixed(1)} kg recorded weight gain with acceptable feed cost.` };
  }
  if (costPerGain !== null && costPerGain > 300) {
    return { label: 'SELL', tone: 'bad', reason: `Feed cost is ${money(costPerGain)} per kg gain.` };
  }
  if (gain === 0 && milk === 0 && kiddings === 0 && (goat.weights || []).length < 2) {
    return { label: 'REVIEW', tone: 'review', reason: 'Add more weight, feed, milk or breeding data before deciding.' };
  }
  return { label: 'REVIEW', tone: 'review', reason: 'Performance data is mixed; review before sale.' };
}


function normalizeGoatRecord(g) {

function ageFromDOB(dob) {
  if (!dob) return '—';
  const d = new Date(dob);
  const now = new Date();
  let months = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
  if (months < 0) return '—';
  if (months < 1) return 'newborn';
  if (months < 12) return `${months} mo`;
  const yrs = Math.floor(months / 12);
  const rem = months % 12;
  return rem ? `${yrs}y ${rem}mo` : `${yrs}y`;
}

function statusMeta(status) {
  switch (status) {
    case 'active': return { label: 'Active', color: '#35492E', bg: '#E3E8DC' };
    case 'sold': return { label: 'Sold', color: '#8B6A1E', bg: '#F0E6C8' };
    case 'culled': return { label: 'Culled', color: '#8B3A2B', bg: '#EFDAD3' };
    case 'deceased': return { label: 'Deceased', color: '#5A5148', bg: '#E4E0D6' };
    default: return { label: status, color: '#5A5148', bg: '#E4E0D6' };
  }
}

// --- Dashboard stats ---
function HerdStats({ goats, large = false }) {
  const active = goats.filter(g => g.status === 'active');
  const females = active.filter(g => g.gender === 'female').length;
  const males = active.filter(g => g.gender === 'male').length;
  const currentYear = new Date().getFullYear();
  const kiddedThisYear = goats.reduce((sum, g) => {
    const childCount = (g.children || []).filter(c => c.date && new Date(c.date).getFullYear() === currentYear).length;
    const kiddingCount = (g.breeding || [])
      .filter(b => b.type === 'kidded' && b.date && new Date(b.date).getFullYear() === currentYear)
      .reduce((s, b) => s + (Number(b.count) || 0), 0);
    return sum + Math.max(childCount, kiddingCount);
  }, 0);

  const stats = [
    { label: 'Active animals', value: active.length, icon: Tag },
    { label: 'Female / Male', value: `${females} / ${males}`, icon: Heart },
    { label: 'Kids this year', value: kiddedThisYear, icon: Baby },
  ];

  return (
    <div className={`stats-grid ${large ? 'stats-grid-large' : ''}`}>
      {stats.map((s) => (
        <div className="stat-card" key={s.label}>
          <s.icon size={16} strokeWidth={2} className="stat-icon" />
          <div className="stat-value">{s.value}</div>
          <div className="stat-label">{s.label}</div>
        </div>
      ))}
    </div>
  );
}

function HerdVaccineAlerts({ goats, onOpenGoat }) {
  const alerts = [];
  goats.filter((g) => g.status === 'active').forEach((g) => {
    computeVaccineStatuses(g).forEach((v) => {
      if (v.status === 'overdue' || v.status === 'due-soon') {
        alerts.push({ goat: g, vaccine: v });
      }
    });
  });
  alerts.sort((a, b) => (a.vaccine.daysDiff ?? 0) - (b.vaccine.daysDiff ?? 0));
  if (alerts.length === 0) return null;

  return (
    <div className="vax-alert-block">
      <div className="vax-alert-header"><Syringe size={14} /> Vaccines due ({alerts.length})</div>
      <div className="vax-alert-list">
        {alerts.slice(0, 6).map((a, i) => (
          <button key={i} className="vax-alert-item" onClick={() => onOpenGoat(a.goat.id)}>
            <span className={`vaccine-dot vaccine-dot-${a.vaccine.status}`} />
            <span className="vax-alert-eid mono">{a.goat.eid}</span>
            <span className="vax-alert-name">{a.vaccine.name}</span>
            <span className="vax-alert-when">{a.vaccine.status === 'overdue' ? `${Math.abs(a.vaccine.daysDiff)}d overdue` : `due in ${a.vaccine.daysDiff}d`}</span>
          </button>
        ))}
      </div>
      {alerts.length > 6 && <div className="vax-alert-more">+{alerts.length - 6} more</div>}
    </div>
  );
}

    const vaccineMeta = VACCINE_SCHEDULE.find((v) => v.id === hVaccine);
    const note = hType === 'vaccination' && !hNote.trim() ? `${vaccineMeta?.name} dose` : hNote;
    const health = [...goat.health, { date: hDate, type: hType, note, vaccine: hType === 'vaccination' ? hVaccine : undefined }].sort((a, b) => b.date.localeCompare(a.date));
    onUpdate({ ...goat, health });
    setHNote(''); setHVaccine(''); setAddingHealth(false);
  };
  const saveBreeding = () => {
    const breeding = [...goat.breeding, { date: bDate, type: bType, partner: bPartner, count: bCount, note: bNote, expectedKiddingDate: bType === 'mated' ? expectedKiddingDate(bDate) : '' }].sort((a, b) => b.date.localeCompare(a.date));
    onUpdate({ ...goat, breeding });
    setBPartner(''); setBCount(''); setBNote(''); setAddingBreeding(false);
  };

  const saveKid = () => {
    const child = normalizeGoatRecord({
      ...emptyGoat(),
      eid: kidEid.trim(),
      name: kidName.trim(),
      gender: kidGender,
      dob: kidDob,
      dam: goat.eid,
      damName: goat.name || '',
      yard: kidYard,
      status: 'active',
      weights: kidBirthWeight ? [{ date: kidDob, kg: Number(kidBirthWeight) }] : [],
      createdAt: new Date().toISOString(),
    });
    if (!child.eid) return;
    const children = [...(goat.children || []), { childId: child.id, eid: child.eid, date: kidDob, gender: kidGender }];
    const existingKidding = (goat.breeding || []).find(b => b.type === 'kidded' && b.date === kidDob);
    const breeding = existingKidding
      ? (goat.breeding || []).map(b => b === existingKidding ? { ...b, count: Number(b.count || 0) + 1 } : b)
      : [...(goat.breeding || []), { date: kidDob, type: 'kidded', partner: goat.sire || '', count: 1, note: `Kid ${child.eid}` }];
    onAddGoat(child, { ...goat, children, breeding });
    setKidEid(''); setKidName(''); setKidGender('female'); setKidBirthWeight(''); setKidYard(goat.yard || ''); setAddingKid(false);
    // Parent component consumes __goatKidToCreate when this update returns.
  };
  const delWeight = (i) => onUpdate({ ...goat, weights: goat.weights.filter((_, idx) => idx !== i) });
  const delHealth = (i) => onUpdate({ ...goat, health: goat.health.filter((_, idx) => idx !== i) });
  const delBreeding = (i) => onUpdate({ ...goat, breeding: goat.breeding.filter((_, idx) => idx !== i) });
  const saveMovement = () => {
    if (!mTo || !mDate) return;
    const movement = [...(goat.movement || []), { date: mDate, fromYard: mFrom, toYard: mTo, reason: mReason, note: mNote }].sort((a, b) => b.date.localeCompare(a.date));
    onUpdate({ ...goat, yard: mTo, movement });
    setMFrom(mTo); setMTo(''); setMReason(''); setMNote(''); setAddingMovement(false);
  };
  const saveMilk = () => {
    if (!milkMorning && !milkEvening) return;
    const totalLitres = (Number(milkMorning) || 0) + (Number(milkEvening) || 0);
    const milk = [...(goat.milk || []), { date: milkDate, morningLitres: Number(milkMorning) || 0, eveningLitres: Number(milkEvening) || 0, totalLitres, note: milkNote }].sort((a, b) => b.date.localeCompare(a.date));
    onUpdate({ ...goat, milk });
    setMilkMorning(''); setMilkEvening(''); setMilkNote(''); setAddingMilk(false);
  };
  const saveFeed = () => {
    if (!feedCost) return;
    const feed = [...(goat.feed || []), { date: feedDate, cost: Number(feedCost) || 0, kgGained: Number(feedGain) || 0, note: feedNote }].sort((a, b) => b.date.localeCompare(a.date));
    onUpdate({ ...goat, feed });
    setFeedCost(''); setFeedGain(''); setFeedNote(''); setAddingFeed(false);
  };
  const delMovement = (i) => onUpdate({ ...goat, movement: (goat.movement || []).filter((_, idx) => idx !== i) });
  const delMilk = (i) => onUpdate({ ...goat, milk: (goat.milk || []).filter((_, idx) => idx !== i) });
  const delFeed = (i) => onUpdate({ ...goat, feed: (goat.feed || []).filter((_, idx) => idx !== i) });

  const sortedWeights = [...goat.weights].sort((a, b) => b.date.localeCompare(a.date));
  const growthRate = goat.weights.length >= 2
    ? (() => {
        const first = goat.weights[0], last = goat.weights[goat.weights.length - 1];
        const days = (new Date(last.date) - new Date(first.date)) / 86400000;
        if (days <= 0) return null;
        return (((last.kg - first.kg) / days) * 30).toFixed(2);
      })()
    : null;

  return (
    <div className="sheet">
      <div className="sheet-header">
        <button className="icon-btn" onClick={onBack}><ChevronLeft size={20} /></button>
        <div className="sheet-title mono">{goat.eid}</div>
        <button className="icon-btn" onClick={() => onEdit(goat)}>Edit</button>
      </div>

      <div className="detail-hero">
        <div className="detail-hero-notch" />
        <div className="detail-name">{goat.name || 'Unnamed'}</div>
        <div className="detail-sub">{goat.species || 'Goat'} · {goat.breed || 'Breed unknown'} · {goat.gender === 'female' ? 'Female' : 'Male'} · {ageFromDOB(goat.dob)}</div>
        <span className="tag-status" style={{ color: meta.color, background: meta.bg, marginTop: 8 }}>{meta.label}</span>
      </div>

      <div className="tabs">
        {['overview', 'family', 'vaccines', 'health', 'breeding', 'kids', 'movement', 'performance'].map((t) => (
          <button key={t} className={`tab-btn ${tab === t ? 'tab-active' : ''}`} onClick={() => setTab(t)}>
            {t === 'overview' ? 'Overview' : t === 'family' ? 'Family' : t === 'vaccines' ? 'Vaccines' : t === 'health' ? 'Health' : t === 'breeding' ? 'Breeding' : t === 'kids' ? 'Kids' : t === 'movement' ? 'Movement' : 'Performance'}
          </button>
        ))}
      </div>

      <div className="sheet-body">
        {tab === 'overview' && (
          <div>
            {goat.photo && <img className="detail-photo" src={goat.photo} alt={`${goat.eid} animal`} />}
            <div className="overview-grid">
              <div className="ov-item"><span>Yard / pen</span><strong>{goat.yard ? `Yard ${goat.yard}` : 'Unassigned'}</strong></div>
              <div className="ov-item"><span>Date of birth</span><strong>{goat.dob || '—'}</strong></div>
              <div className="ov-item"><span>Dam</span><strong className="mono">{goat.dam || '—'}</strong></div>
              <div className="ov-item"><span>Sire</span><strong className="mono">{goat.sire || '—'}</strong></div>
              <div className="ov-item"><span>Latest weight</span><strong>{sortedWeights[0] ? `${sortedWeights[0].kg} kg` : '—'}</strong></div>
              <div className="ov-item"><span>Growth rate</span><strong>{growthRate ? `${growthRate} kg/mo` : '—'}</strong></div>
              <div className="ov-item"><span>Health entries</span><strong>{goat.health.length}</strong></div>
              <div className="ov-item"><span>Feed cost/kg gain</span><strong>{feedCostPerKgGain(goat) === null ? '—' : money(feedCostPerKgGain(goat))}</strong></div>
              <div className="ov-item"><span>Performance verdict</span><strong className={`verdict-text verdict-${performanceVerdict(goat).tone}`}>{performanceVerdict(goat).label}</strong></div>
            </div>
            {goat.notes && <div className="notes-block"><span>Notes</span><p>{goat.notes}</p></div>}

            <button className="danger-link" onClick={() => setConfirmDelete(true)}><Trash2 size={13} /> Delete this record</button>
            {confirmDelete && (
              <div className="confirm-box">
                <p>Permanently delete {goat.eid}'s record? This can't be undone.</p>
                <div className="confirm-actions">
                  <button className="ghost-btn" onClick={() => setConfirmDelete(false)}>Cancel</button>
                  <button className="danger-btn" onClick={() => onDelete(goat.id)}>Delete</button>
                </div>
              </div>
            )}
          </div>
        )}

        {tab === 'family' && (
          <div className="family-view">
            {(() => {
              const all = herdGoats || [];
              const byEid = (eid) => {
                if (!eid) return null;
                const key = String(eid).trim().toLowerCase();
                return all.find(g => String(g.eid || '').trim().toLowerCase() === key) || null;
              };

              const parentDam = byEid(goat.dam);
              const parentSire = byEid(goat.sire);

              const grandDam = parentDam ? byEid(parentDam.dam) : null;
              const grandSire = parentDam ? byEid(parentDam.sire) : null;
              const grandDam2 = parentSire ? byEid(parentSire.dam) : null;
              const grandSire2 = parentSire ? byEid(parentSire.sire) : null;

              const children = all.filter(g =>
                String(g.dam || '').trim().toLowerCase() === String(goat.eid || '').trim().toLowerCase() ||
                String(g.sire || '').trim().toLowerCase() === String(goat.eid || '').trim().toLowerCase()
              );

              const grandchildren = all.filter(g =>
                children.some(c =>
                  String(g.dam || '').trim().toLowerCase() === String(c.eid || '').trim().toLowerCase() ||
                  String(g.sire || '').trim().toLowerCase() === String(c.eid || '').trim().toLowerCase()
                )
              );

              const familyCard = (member, role) => (
                member ? (
                  <button
                    className={`family-card ${member.id === goat.id ? 'family-card-current' : ''}`}
                    onClick={() => member.id !== goat.id && onOpenGoat?.(member.id)}
                  >
                    <div className="family-role">{role}</div>
                    <div className="family-eid mono">{member.eid || 'No EID'}</div>
                    <div className="family-name">{member.name || 'Unnamed'}</div>
                    <div className="family-meta">
                      {member.gender === 'female' ? 'Female' : 'Male'} · {member.breed || 'Breed unknown'}
                    </div>
                    {member.yard && <div className="family-yard">Yard {member.yard}</div>}
                  </button>
                ) : (
                  <div className="family-card family-card-empty">
                    <div className="family-role">{role}</div>
                    <div className="family-empty">Not linked</div>
                  </div>
                )
              );

              return (
                <>
                  <div className="family-intro">
                    <div>
                      <strong>Full family</strong>
                      <span>Tap any linked animal to open its complete record.</span>
                    </div>
                    <div className="family-count">{children.length} kids</div>
                  </div>

                  <div className="family-section">
                    <div className="family-section-title">Grandparents</div>
                    <div className="family-grid">
                      {familyCard(grandDam, "Dam's mother")}
                      {familyCard(grandSire, "Dam's father")}
                      {familyCard(grandDam2, "Sire's mother")}
                      {familyCard(grandSire2, "Sire's father")}
                    </div>
                  </div>

                  <div className="family-section">
                    <div className="family-section-title">Parents</div>
                    <div className="family-grid two">
                      {familyCard(parentDam, 'Mother / Dam')}
                      {familyCard(parentSire, 'Father / Sire')}
                    </div>
                  </div>

                  <div className="family-current-wrap">
                    <div className="family-section-title">This animal</div>
                    {familyCard(goat, 'Current goat')}
                  </div>

                  <div className="family-section">
                    <div className="family-section-title">Children ({children.length})</div>
                    {children.length ? (
                      <div className="family-grid">
                        {children.map(child => familyCard(child, child.gender === 'female' ? 'Daughter / Kid' : 'Son / Kid'))}
                      </div>
                    ) : (
                      <div className="family-no-data">No linked children yet.</div>
                    )}
                  </div>

                  <div className="family-section">
                    <div className="family-section-title">Grandchildren ({grandchildren.length})</div>
                    {grandchildren.length ? (
                      <div className="family-grid">
                        {grandchildren.map(child => familyCard(child, child.gender === 'female' ? 'Granddaughter' : 'Grandson'))}
                      </div>
                    ) : (
                      <div className="family-no-data">No linked grandchildren yet.</div>
                    )}
                  </div>
                </>
              );
            })()}
          </div>
        )}

        {tab === 'vaccines' && (
          <div>
            <div className="vaccine-disclaimer">
              <ShieldCheck size={13} /> General reference schedule — confirm timing and dosage with a local vet; disease risk varies by region.
            </div>
            {computeVaccineStatuses(goat).map((v) => (
              <div className="vaccine-row" key={v.id}>
                <div className={`vaccine-dot vaccine-dot-${v.status}`} />
                <div className="vaccine-info">
                  <div className="vaccine-name">{v.name} <span className="vaccine-full">— {v.full}</span></div>
                  <div className="vaccine-meta">
                    {v.status === 'overdue' && v.dueDate && <span className="vaccine-badge vaccine-badge-overdue"><Clock size={11} /> Overdue by {Math.abs(v.daysDiff)}d</span>}
                    {v.status === 'due-soon' && v.dueDate && <span className="vaccine-badge vaccine-badge-due"><Clock size={11} /> Due in {v.daysDiff}d</span>}
                    {v.status === 'scheduled' && v.dueDate && <span className="vaccine-badge vaccine-badge-ok"><ShieldCheck size={11} /> Next due {v.dueDate.toISOString().slice(0, 10)}</span>}
                    {v.status === 'unknown' && <span className="vaccine-badge">Add date of birth to schedule</span>}
                    {v.lastDose && <span className="vaccine-last">Last given {v.lastDose.date}</span>}
                  </div>
                  <div className="vaccine-note">{v.note}</div>
                </div>
                <button
                  className="vaccine-log-btn"
                  onClick={() => { setHType('vaccination'); setHVaccine(v.id); setHDate(new Date().toISOString().slice(0, 10)); setTab('health'); setAddingHealth(true); }}
                >
                  <Syringe size={13} /> Log
                </button>
              </div>
            ))}
          </div>
        )}

        {tab === 'health' && (
          <div>
            {goat.health.length === 0 && <div className="empty-state">No health records yet. Log a treatment, vaccination, or illness below.</div>}
            {goat.health.map((h, i) => (
              <LogRow key={i} icon={Stethoscope} primary={`${h.type[0].toUpperCase()}${h.type.slice(1)}`} secondary={`${h.date} — ${h.note}`} onDelete={() => delHealth(goat.health.indexOf(h))} />
            ))}
            {!addingHealth ? (
              <button className="add-link" onClick={() => setAddingHealth(true)}><Plus size={14} /> Log health event</button>
            ) : (
              <div className="inline-form">
                <div className="field-row">
                  <label className="field">
                    <span>Type</span>
                    <select value={hType} onChange={(e) => setHType(e.target.value)}>
                      <option value="treatment">Treatment</option>
                      <option value="vaccination">Vaccination</option>
                      <option value="illness">Illness</option>
                      <option value="deworming">Deworming</option>
                      <option value="checkup">Checkup</option>
                    </select>
                  </label>
                  <label className="field"><span>Date</span><input type="date" value={hDate} onChange={(e) => setHDate(e.target.value)} /></label>
                </div>
                {hType === 'vaccination' && (
                  <label className="field">
                    <span>Vaccine</span>
                    <select value={hVaccine} onChange={(e) => setHVaccine(e.target.value)}>
                      <option value="">Select vaccine</option>
                      {VACCINE_SCHEDULE.map((v) => (
                        <option key={v.id} value={v.id}>{v.name} — {v.full}</option>
                      ))}
                    </select>
                  </label>
                )}
                <label className="field"><span>Note</span><input value={hNote} onChange={(e) => setHNote(e.target.value)} placeholder={hType === 'vaccination' ? 'Optional — e.g. 2ml, subcutaneous' : 'e.g. Antibiotic for cough, 3 days course'} /></label>
                <div className="inline-actions">
                  <button className="ghost-btn" onClick={() => setAddingHealth(false)}>Cancel</button>
                  <button className="primary-btn small" onClick={saveHealth}>Save</button>
                </div>
              </div>
            )}
          </div>
        )}

        {tab === 'breeding' && (
          <div>
            {goat.breeding.length === 0 && <div className="empty-state">No breeding records yet. Log a mating or kidding below.</div>}
            {goat.breeding.map((b, i) => (
              <LogRow
                key={i}
                icon={b.type === 'kidded' ? Baby : Heart}
                primary={b.type === 'kidded' ? `Kidded${b.count ? ` — ${b.count} kid(s)` : ''}` : `Mated${b.partner ? ` with ${b.partner}` : ''}`}
                secondary={`${b.date}${b.note ? ` — ${b.note}` : ''}`}
                onDelete={() => delBreeding(goat.breeding.indexOf(b))}
              />
            ))}
            {!addingBreeding ? (
              <button className="add-link" onClick={() => setAddingBreeding(true)}><Plus size={14} /> Log breeding event</button>
            ) : (
              <div className="inline-form">
                <div className="field-row">
                  <label className="field">
                    <span>Type</span>
                    <select value={bType} onChange={(e) => setBType(e.target.value)}>
                      <option value="mated">Mated</option>
                      <option value="kidded">Kidded</option>
                    </select>
                  </label>
                  <label className="field"><span>Date</span><input type="date" value={bDate} onChange={(e) => setBDate(e.target.value)} /></label>
                </div>
                {bType === 'mated' ? (
                  <label className="field">
                    <span>Partner (male EID)</span>
                    <div className="input-with-scan">
                      <input value={bPartner} onChange={(e) => setBPartner(e.target.value)} placeholder="Male EID" />
                      <button type="button" className="field-scan-btn" onClick={() => onOpenScanner?.('bPartner')}><ScanLine size={14} /></button>
                    </div>
                  </label>
                ) : (
                  <label className="field"><span>Number of kids</span><input type="number" value={bCount} onChange={(e) => setBCount(e.target.value)} /></label>
                )}
                <label className="field"><span>Note</span><input value={bNote} onChange={(e) => setBNote(e.target.value)} placeholder="Optional" /></label>
                <div className="inline-actions">
                  <button className="ghost-btn" onClick={() => setAddingBreeding(false)}>Cancel</button>
                  <button className="primary-btn small" onClick={saveBreeding}>Save</button>
                </div>
              </div>
            )}
          </div>
        )}


        {tab === 'kids' && (
          <div>
            <div className="vaccine-disclaimer">
              <Baby size={13} /> Add a newborn directly from the mother’s record. The new kid is automatically linked to this animal as its dam.
            </div>
            {(goat.children || []).length === 0 && <div className="empty-state">No kids linked to this animal yet.</div>}
            {(goat.children || []).map((c, i) => (
              <LogRow
                key={i}
                icon={Baby}
                primary={`${c.eid || 'No EID'}${c.gender ? ` — ${c.gender === 'female' ? 'Female kid' : 'Male kid'}` : ''}`}
                secondary={`${c.date || '—'}${c.childId ? ' — child record created' : ''}`}
              />
            ))}
            {!addingKid ? (
              <button className="add-link" onClick={() => setAddingKid(true)}><Plus size={14} /> Add newborn kid</button>
            ) : (
              <div className="inline-form">
                <label className="field">
                  <span>New kid EID *</span>
                  <div className="input-with-scan">
                    <input className="mono-input" value={kidEid} onChange={e => setKidEid(e.target.value)} placeholder="Enter / scan the kid's EID" />
                    <button type="button" className="field-scan-btn" onClick={() => { setScannerTarget('kidEid'); setScannerMode('field'); setScannerOpen(true); }}><ScanLine size={14} /></button>
                  </div>
                </label>
                <div className="field-row">
                  <label className="field"><span>Name</span><input value={kidName} onChange={e => setKidName(e.target.value)} placeholder="Optional" /></label>
                  <label className="field"><span>Gender</span><select value={kidGender} onChange={e => setKidGender(e.target.value)}><option value="female">Female kid</option><option value="male">Male kid</option></select></label>
                </div>
                <div className="field-row">
                  <label className="field"><span>Date of birth</span><input type="date" value={kidDob} onChange={e => setKidDob(e.target.value)} /></label>
                  <label className="field"><span>Birth weight (kg)</span><input type="number" step="0.1" value={kidBirthWeight} onChange={e => setKidBirthWeight(e.target.value)} /></label>
                </div>
                <label className="field">
                  <span>Yard / pen</span>
                  <select value={kidYard} onChange={e => setKidYard(e.target.value)}>
                    <option value="">Unassigned</option>
                    {Array.from({length:20},(_,i)=><option key={i+1} value={String(i+1)}>Yard {i+1}</option>)}
                  </select>
                </label>
                <div className="inline-actions">
                  <button className="ghost-btn" onClick={() => setAddingKid(false)}>Cancel</button>
                  <button className="primary-btn small" onClick={saveKid} disabled={!kidEid.trim()}>Create kid record</button>
                </div>
              </div>
            )}
          </div>
        )}

        {tab === 'movement' && (
          <div>
            {(goat.movement || []).length === 0 && <div className="empty-state">No movement records yet.</div>}
            {(goat.movement || []).map((m, i) => (
              <LogRow key={i} icon={ArrowRightLeft} primary={`${m.fromYard ? `Yard ${m.fromYard}` : 'Unassigned'} → Yard ${m.toYard}`} secondary={`${m.date}${m.reason ? ` — ${m.reason}` : ''}${m.note ? ` — ${m.note}` : ''}`} onDelete={() => delMovement(i)} />
            ))}
            {!addingMovement ? (
              <button className="add-link" onClick={() => setAddingMovement(true)}><Plus size={14} /> Log movement</button>
            ) : (
              <div className="inline-form">
                <div className="field-row">
                  <label className="field"><span>Date</span><input type="date" value={mDate} onChange={e => setMDate(e.target.value)} /></label>
                  <label className="field"><span>From yard</span><select value={mFrom} onChange={e => setMFrom(e.target.value)}><option value="">Unassigned</option>{Array.from({length:20},(_,i)=><option key={i+1} value={String(i+1)}>Yard {i+1}</option>)}</select></label>
                </div>
                <label className="field"><span>To yard *</span><select value={mTo} onChange={e => setMTo(e.target.value)}><option value="">Select yard</option>{Array.from({length:20},(_,i)=><option key={i+1} value={String(i+1)}>Yard {i+1}</option>)}</select></label>
                <label className="field"><span>Reason</span><input value={mReason} onChange={e => setMReason(e.target.value)} placeholder="Breeding, quarantine, sale, feeding..." /></label>
                <label className="field"><span>Note</span><input value={mNote} onChange={e => setMNote(e.target.value)} placeholder="Optional" /></label>
                <div className="inline-actions"><button className="ghost-btn" onClick={() => setAddingMovement(false)}>Cancel</button><button className="primary-btn small" onClick={saveMovement}>Save</button></div>
              </div>
            )}
          </div>
        )}

        {tab === 'performance' && (
          <div>
            {(() => {
              const verdict = performanceVerdict(goat);
              return (
                <>
                  <div className={`performance-card performance-${verdict.tone}`}>
                    <div className="performance-kicker">Keep-or-sell performance verdict</div>
                    <div className="performance-label">{verdict.label}</div>
                    <p>{verdict.reason}</p>
                  </div>
                  <div className="overview-grid">
                    <div className="ov-item"><span>Weight gain</span><strong>{goatWeightGain(goat).toFixed(1)} kg</strong></div>
                    <div className="ov-item"><span>Feed cost</span><strong>{money(goatFeedCost(goat))}</strong></div>
                    <div className="ov-item"><span>Feed cost/kg gain</span><strong>{feedCostPerKgGain(goat) === null ? '—' : money(feedCostPerKgGain(goat))}</strong></div>
                    <div className="ov-item"><span>Milk logged</span><strong>{(goat.milk || []).reduce((s,m)=>s+(Number(m.totalLitres)||0),0).toFixed(2)} L</strong></div>
                    <div className="ov-item"><span>Kiddings</span><strong>{(goat.breeding || []).filter(b=>b.type==='kidded').length}</strong></div>
                    <div className="ov-item"><span>Current yard</span><strong>{goat.yard ? `Yard ${goat.yard}` : '—'}</strong></div>
                  </div>
                  <div className="vaccine-disclaimer"><BarChart3 size={13} /> Verdict is a farm-management aid, not a veterinary or breeding recommendation. Add more records for a stronger signal.</div>
                </>
              );
            })()}
          </div>
        )}
      </div>
    </div>
  );
}



function EIDScanner({ goats, onSelectGoat, onClose, mode='open', onScanValue }) {
  const [manual, setManual] = useState('');
  const [scanStatus, setScanStatus] = useState('Ready to scan');
  const [cameraOpen, setCameraOpen] = useState(false);
  const [torchOn, setTorchOn] = useState(false);
  const [torchSupported, setTorchSupported] = useState(false);
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const detectorRef = useRef(null);

  const findGoat = (value) => {
    const eid = String(value || '').trim().toLowerCase();
    if (!eid) return;
    const goat = goats.find(g => String(g.eid || '').trim().toLowerCase() === eid);
    if (mode === 'field') {
      setScanStatus(goat ? `Found ${goat.eid}` : `Scanned EID: ${String(value).trim()}`);
      onScanValue?.(String(value).trim());
      return;
    }
    if (goat) {
      setScanStatus(`Found ${goat.eid}`);
      onSelectGoat(goat.id);
    } else {
      setScanStatus(`No animal on this tag yet — opening the form to add it.`);
      onScanValue?.(String(value).trim());
    }
  };

  const startCamera = async () => {
    setScanStatus('Requesting camera permission…');
    if (!navigator.mediaDevices?.getUserMedia) {
      setScanStatus('Camera is not available here. Open EID Tracker in Chrome/Android HTTPS and allow camera access.');
      return;
    }
    try {
      // Ask for permission FIRST so tapping “Start camera scan” immediately
      // triggers the Android/browser camera permission prompt.
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      streamRef.current = stream;
      setCameraOpen(true);
      setScanStatus('Opening camera…');

      if (!videoRef.current) {
        setScanStatus('Camera view failed to load. Please try again.');
        stopCamera();
        return;
      }
      videoRef.current.srcObject = stream;
      await videoRef.current.play();

      try {
        const track = stream.getVideoTracks()[0];
        const caps = track?.getCapabilities?.();
        setTorchSupported(!!(caps && caps.torch));
      } catch { setTorchSupported(false); }

      // BarcodeDetector is optional. The camera should still open even when
      // the browser does not implement it; manual EID entry remains available.
      if (!('BarcodeDetector' in window)) {
        setScanStatus('Camera is open. Point at the QR/barcode. This browser cannot auto-read the code; use Chrome or enter the EID below.');
        return;
      }

      const detector = new window.BarcodeDetector({
        formats: ['qr_code', 'code_128', 'code_39', 'code_93', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf', 'codabar']
      });
      detectorRef.current = detector;
      setScanStatus('Point the camera at the QR/barcode');

      const loop = async () => {
        if (!streamRef.current || !videoRef.current || !detectorRef.current) return;
        try {
          const codes = await detectorRef.current.detect(videoRef.current);
          if (codes.length) {
            findGoat(codes[0].rawValue);
            stopCamera();
            return;
          }
        } catch {}
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    } catch (e) {
      const name = e?.name || '';
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
        setScanStatus('Camera permission denied. Allow Camera permission for this app/browser, then tap Start camera scan again.');
      } else if (name === 'NotFoundError') {
        setScanStatus('No camera found on this device.');
      } else {
        setScanStatus('Could not open camera. Check camera permission and HTTPS, then try again.');
      }
    }
  };

  const stopCamera = () => {
    streamRef.current?.getTracks?.().forEach(t => t.stop());
    streamRef.current = null;
    setCameraOpen(false);
    setTorchOn(false);
    setTorchSupported(false);
  };

  const toggleTorch = async () => {
    try {
      const track = streamRef.current?.getVideoTracks?.()[0];
      if (!track) return;
      const next = !torchOn;
      await track.applyConstraints({ advanced: [{ torch: next }] });
      setTorchOn(next);
    } catch {
      setScanStatus('Could not toggle flash on this device.');
    }
  };

  useEffect(() => () => stopCamera(), []);

  return (
    <div className="scanner-overlay">
      <div className="scanner-sheet">
        <div className="sheet-header">
          <button className="icon-btn" onClick={() => { stopCamera(); onClose(); }}><ChevronLeft size={20} /></button>
          <div className="sheet-title"><ScanLine size={17} /> EID Scanner</div>
          <div style={{width:36}} />
        </div>
        <div className="sheet-body">
          <div className="scanner-help">
            <ScanLine size={20} />
            <div><strong>Scan an animal EID</strong><p>Camera scanning works with QR/barcode labels. For true electronic livestock RFID tags, connect a compatible Bluetooth/USB RFID reader; most phone cameras cannot read RFID.</p></div>
          </div>
          <video ref={videoRef} className={`scanner-video${cameraOpen ? '' : ' hidden'}`} playsInline muted />
          {cameraOpen && torchSupported && (
            <button className="ghost-btn" style={{ marginTop: 8 }} onClick={toggleTorch}>
              <Flashlight size={14} /> Flash {torchOn ? 'On' : 'Off'}
            </button>
          )}
          <div className="scanner-status">{scanStatus}</div>
          <div className="scanner-actions">
            {!cameraOpen ? <button className="primary-btn small" onClick={startCamera}><Camera size={14} /> Scan EID / Open camera</button> : <button className="ghost-btn" onClick={stopCamera}>Stop camera</button>}
          </div>
          <div className="scanner-divider">or enter EID / use RFID reader</div>
          <div className="scanner-manual">
            <input className="mono-input" autoFocus value={manual} onChange={e=>setManual(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'){findGoat(manual);setManual('')}}} placeholder="Scan/type EID, then press Enter" />
            <button className="primary-btn small" onClick={() => { findGoat(manual); setManual(''); }}>Find animal</button>
          </div>
        </div>
      </div>
    </div>
  );
}
