function KiddingReminders({ goats, onOpenGoat }) {
  const today = new Date();
  const items = [];
  goats.filter(g => g.status === 'active' && g.gender === 'female').forEach(g => {
    (g.breeding || []).filter(b => b.type === 'mated').forEach(b => {
      const expected = b.expectedKiddingDate || expectedKiddingDate(b.date);
      if (!expected) return;
      const diff = Math.ceil((new Date(expected) - today) / 86400000);
      if (diff >= -14 && diff <= 45) items.push({ goat: g, expected, diff });
    });
  });
  items.sort((a,b) => a.diff - b.diff);
  if (!items.length) return null;
  return (
    <div className="kidding-panel">
      <div className="section-heading"><Calendar size={14} /> Kidding calendar / reminders</div>
      {items.slice(0, 6).map((x, i) => (
        <button key={i} className="kidding-item" onClick={() => onOpenGoat(x.goat.id)}>
          <span className="kidding-eid mono">{x.goat.eid}</span>
          <span className="kidding-date">{x.expected}</span>
          <span className="kidding-when">{x.diff < 0 ? `${Math.abs(x.diff)}d overdue` : x.diff === 0 ? 'Today' : `in ${x.diff}d`}</span>
        </button>
      ))}
    </div>
  );
}

function FinancePanel({ finance, onChange }) {
  const [month, setMonth] = useState(currentMonthKey());
  const [kind, setKind] = useState('expense');
  const [date, setDate] = useState(dateToISODate(new Date()));
  const EXPENSE_CATEGORIES = ['Feed', 'Medicine', 'Vaccination', 'Labour', 'Transport', 'Purchase', 'Other'];
  const INCOME_CATEGORIES = ['Animal Sale', 'Milk', 'Other'];
  const [category, setCategory] = useState(EXPENSE_CATEGORIES[0]);
  const [amount, setAmount] = useState('');
  const [note, setNote] = useState('');
  const [editingId, setEditingId] = useState(null);
  const rows = finance.filter(x => (x.date || '').slice(0,7) === month);
  const income = rows.filter(x => x.kind === 'income').reduce((s,x)=>s+(Number(x.amount)||0),0);
  const expense = rows.filter(x => x.kind === 'expense').reduce((s,x)=>s+(Number(x.amount)||0),0);

  const categoryOptions = kind === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;

  const changeKind = (nextKind) => {
    setKind(nextKind);
    const opts = nextKind === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
    if (!opts.includes(category)) setCategory(opts[0]);
  };

  const resetForm = () => {
    setEditingId(null);
    setKind('expense');
    setDate(dateToISODate(new Date()));
    setCategory(EXPENSE_CATEGORIES[0]);
    setAmount('');
    setNote('');
  };

  const submit = () => {
    if (!amount) return;
    if (editingId) {
      onChange(finance.map((f) => f.id === editingId ? { ...f, date, kind, category, amount: Number(amount), note } : f).sort((a,b)=>b.date.localeCompare(a.date)));
    } else {
      onChange([...finance, { id:`fin_${Date.now()}`, date, kind, category, amount:Number(amount), note }].sort((a,b)=>b.date.localeCompare(a.date)));
    }
    resetForm();
  };

  const editRow = (r) => {
    setEditingId(r.id);
    setKind(r.kind);
    setDate(r.date);
    setCategory(r.category);
    setAmount(String(r.amount));
    setNote(r.note || '');
  };

  const deleteRow = (id) => {
    onChange(finance.filter((f) => f.id !== id));
    if (editingId === id) resetForm();
  };

  return (
    <div className="finance-panel">
      <div className="section-heading"><CircleDollarSign size={14} /> Monthly finance</div>
      <div className="finance-month-row">
        <input type="month" value={month} onChange={e=>setMonth(e.target.value)} />
        <div className="finance-net"><span>{income-expense >= 0 ? 'Net Profit' : 'Net Loss'}</span><strong className={income-expense >= 0 ? 'net-positive' : 'net-negative'}>{money(Math.abs(income-expense))}</strong></div>
      </div>
      <div className="finance-summary">
        <div><span>Income</span><strong>{money(income)}</strong></div>
        <div><span>Expense</span><strong>{money(expense)}</strong></div>
      </div>
      <div className="inline-form">
        {editingId && <div className="muted" style={{ fontSize: 13 }}>Editing entry — <span style={{ textDecoration:'underline', cursor:'pointer' }} onClick={resetForm}>cancel</span></div>}
        <div className="field-row">
          <label className="field"><span>Type</span><select value={kind} onChange={e=>changeKind(e.target.value)}><option value="expense">Expense</option><option value="income">Income</option></select></label>
          <label className="field"><span>Date</span><input type="date" value={date} onChange={e=>setDate(e.target.value)} /></label>
        </div>
        <div className="field-row">
          <label className="field"><span>Category</span><select value={category} onChange={e=>setCategory(e.target.value)}>{categoryOptions.map(c => <option key={c}>{c}</option>)}</select></label>
          <label className="field"><span>Amount (₹)</span><input type="number" step="0.01" value={amount} onChange={e=>setAmount(e.target.value)} /></label>
        </div>
        <label className="field"><span>Note</span><input value={note} onChange={e=>setNote(e.target.value)} placeholder="Optional" /></label>
        <button className="primary-btn small" onClick={submit}>{editingId ? 'Save changes' : 'Add entry'}</button>
      </div>
      {rows.slice(0,8).map((r,i)=>(
        <div className="finance-row" key={r.id || i}>
          <span>{r.date} · {r.category}</span>
          <span style={{ display:'flex', alignItems:'center', gap:2 }}>
            <strong className={r.kind==='income'?'net-positive':'net-negative'}>{r.kind==='income'?'+':'-'}{money(r.amount)}</strong>
            <button className="log-delete" title="Edit" onClick={(e) => { e.stopPropagation(); editRow(r); }}><PencilIcon size={13} /></button>
            <button className="log-delete" title="Delete" onClick={(e) => { e.stopPropagation(); deleteRow(r.id); }}><Trash2 size={13} /></button>
          </span>
        </div>
      ))}
    </div>
  );
}

function MilkPanel({ entries, onChangeEntries, milkSales, onChange, finance, onChangeFinance }) {
  const [month, setMonth] = useState(currentMonthKey());
  const year = month.slice(0, 4);

  const [entryDate, setEntryDate] = useState(dateToISODate(new Date()));
  const [entryLitres, setEntryLitres] = useState('');
  const [entryError, setEntryError] = useState('');

  const dailyMap = {};
  entries.forEach((e) => { dailyMap[e.date] = Number(e.litres) || 0; });

  const monthDays = Object.keys(dailyMap)
    .filter((d) => d.slice(0, 7) === month)
    .sort((a, b) => b.localeCompare(a));
  const monthProduced = monthDays.reduce((s, d) => s + dailyMap[d], 0);

  const record = milkSales[month] || {};
  const soldLitres = record.soldLitres != null ? record.soldLitres : monthProduced;
  const rate = record.rate != null ? record.rate : null;
  const revenue = soldLitres * (rate || 0);

  // Keeps a single auto-generated "Milk" income line in Monthly finance in
  // sync with this month's sale revenue, without touching any manually
  // added finance entries.
  const syncMilkFinance = (monthKey, revenueAmount) => {
    if (!onChangeFinance || !finance) return;
    const existing = finance.find(f => f.autoMilk && (f.date || '').slice(0, 7) === monthKey);
    if (!revenueAmount || revenueAmount <= 0) {
      if (existing) onChangeFinance(finance.filter(f => f !== existing));
      return;
    }
    const label = `Milk sales — ${monthName(monthKey)} ${monthKey.slice(0, 4)}`;
    if (existing) {
      onChangeFinance(finance.map(f => f === existing ? { ...f, amount: revenueAmount, note: label } : f));
    } else {
      const entry = { id: `fin_milk_${monthKey}`, date: `${monthKey}-01`, kind: 'income', category: 'Milk', amount: revenueAmount, note: label, autoMilk: true };
      onChangeFinance([...finance, entry].sort((a, b) => b.date.localeCompare(a.date)));
    }
  };

  const updateMonth = (patch) => {
    const nextRecord = { ...record, ...patch };
    onChange({ ...milkSales, [month]: nextRecord });
    const nextSold = nextRecord.soldLitres != null ? nextRecord.soldLitres : monthProduced;
    const nextRate = nextRecord.rate != null ? nextRecord.rate : 0;
    syncMilkFinance(month, nextSold * nextRate);
  };

  const saveDailyEntry = () => {
    if (!entryDate) return setEntryError('Pick a date.');
    const litres = Number(entryLitres);
    if (!entryLitres || Number.isNaN(litres) || litres < 0) return setEntryError('Enter valid litres.');
    setEntryError('');
    const without = entries.filter((e) => e.date !== entryDate);
    const next = [...without, { date: entryDate, litres }].sort((a, b) => b.date.localeCompare(a.date));
    onChangeEntries(next);
    const nextDate = addDays(entryDate, 1);
    setEntryLitres('');
    setEntryDate(nextDate);
    setMonth(nextDate.slice(0, 7));
  };

  const editEntry = (d) => {
    setEntryDate(d);
    setEntryLitres(String(dailyMap[d]));
  };

  const deleteEntry = (d) => {
    onChangeEntries(entries.filter((e) => e.date !== d));
    if (entryDate === d) { setEntryDate(dateToISODate(new Date())); setEntryLitres(''); }
  };

  // Annual roll-up across all 12 months of the selected year.
  const annualMonths = Array.from({ length: 12 }, (_, i) => `${year}-${String(i + 1).padStart(2, '0')}`);
  const annualRows = annualMonths.map((mk) => {
    const produced = Object.keys(dailyMap).filter((d) => d.slice(0, 7) === mk).reduce((s, d) => s + dailyMap[d], 0);
    const rec = milkSales[mk] || {};
    const sold = rec.soldLitres != null ? rec.soldLitres : produced;
    const r = rec.rate != null ? rec.rate : 0;
    return { month: mk, produced, sold, rate: r, revenue: sold * r };
  });
  const annualProduced = annualRows.reduce((s, r) => s + r.produced, 0);
  const annualSold = annualRows.reduce((s, r) => s + r.sold, 0);
  const annualRevenue = annualRows.reduce((s, r) => s + r.revenue, 0);

  return (
    <div className="milk-panel">
      <div className="section-heading"><Milk size={14} /> Milk production &amp; sales</div>

      <div className="finance-month-row">
        <input type="month" value={month} onChange={(e) => setMonth(e.target.value)} />
      </div>

      <div className="inline-form milk-add-form">
        <div className="field-row">
          <label className="field"><span>Date</span><input type="date" value={entryDate} onChange={(e) => setEntryDate(e.target.value)} /></label>
          <label className="field"><span>Total litres that day (all animals)</span><input type="number" step="0.1" value={entryLitres} onChange={(e) => setEntryLitres(e.target.value)} placeholder="e.g. 18.5" /></label>
        </div>
        {entryError && <div className="form-error"><AlertCircle size={14} /> {entryError}</div>}
        <button className="primary-btn small" onClick={saveDailyEntry}>{dailyMap[entryDate] != null ? 'Update day' : 'Add day'}</button>
      </div>

      <div className="section-heading milk-daily-heading">Daily production — {monthName(month)} {year}</div>
      {monthDays.length === 0 && <div className="milk-empty">No milk added for this month yet. Use the form above to add each day's total.</div>}
      {monthDays.map((d) => (
        <div className="finance-row milk-day-row" key={d}>
          <span onClick={() => editEntry(d)}>{d}</span>
          <span className="milk-day-row-right">
            <strong>{dailyMap[d].toFixed(1)} L</strong>
            <button className="milk-day-delete" onClick={() => deleteEntry(d)} aria-label="Delete entry"><X size={12} /></button>
          </span>
        </div>
      ))}

      <div className="milk-summary-grid">
        <div>
          <span>Produced this month</span>
          <strong>{monthProduced.toFixed(1)} L</strong>
        </div>
        <div>
          <span>Sold this month (L)</span>
          <input
            type="number"
            step="0.1"
            value={soldLitres}
            onChange={(e) => updateMonth({ soldLitres: e.target.value === '' ? null : Number(e.target.value) })}
          />
        </div>
        <div>
          <span>Rate (₹ / litre)</span>
          <input
            type="number"
            step="0.5"
            value={rate ?? ''}
            placeholder="0"
            onChange={(e) => updateMonth({ rate: e.target.value === '' ? null : Number(e.target.value) })}
          />
        </div>
        <div className="milk-revenue-card">
          <span>Total this month</span>
          <strong>{money(revenue)}</strong>
        </div>
      </div>

      <div className="section-heading milk-annual-heading"><BarChart3 size={14} /> Annual summary — {year}</div>
      <div className="milk-annual-table">
        {annualRows.map((r) => (
          <div className="milk-annual-row" key={r.month}>
            <span className="milk-annual-month">{monthName(r.month)}</span>
            <span>{r.produced.toFixed(1)} L</span>
            <span>{r.sold.toFixed(1)} L sold</span>
            <span className="mono">{money(r.revenue)}</span>
          </div>
        ))}
      </div>
      <div className="milk-annual-total">
        <span>Annual total</span>
        <div>
          <strong>{annualProduced.toFixed(1)} L produced</strong>
          <strong>{annualSold.toFixed(1)} L sold</strong>
          <strong className="milk-annual-revenue">{money(annualRevenue)}</strong>
        </div>
      </div>
    </div>
  );
}

function exportGoatCSV(goats, finance) {
  const rows = [];
  const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  goats.forEach(g => {
    rows.push([
      g.eid, g.name, g.breed, g.gender, g.dob, g.status, g.yard,
      g.dam, g.sire, g.weights?.[g.weights.length-1]?.kg || '',
      goatWeightGain(g).toFixed(2), goatFeedCost(g).toFixed(2),
      feedCostPerKgGain(g) == null ? '' : feedCostPerKgGain(g).toFixed(2),
      performanceVerdict(g).label,
      (g.milk || []).reduce((s,m)=>s+(Number(m.totalLitres)||0),0).toFixed(2),
      (g.breeding || []).filter(b=>b.type==='kidded').length,
      (g.movement || []).length
    ].map(esc).join(','));
  });
  const header = ['EID','Name','Breed','Gender','DOB','Status','Yard','Dam','Sire','Latest Weight kg','Weight Gain kg','Feed Cost ₹','Feed Cost/kg Gain ₹','Verdict','Milk Logged L','Kiddings','Movements'].map(esc).join(',');
  const csv = [header, ...rows].join('\n');
  const financeHeader = ['Finance Date','Type','Category','Amount ₹','Note'].map(esc).join(',');
  const financeRows = (finance || []).map(r => [r.date,r.kind,r.category,r.amount,r.note].map(esc).join(','));
  const full = `${csv}\n\n${financeHeader}\n${financeRows.join('\n')}`;
  const blob = new Blob([full], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `goat-herd-export-${dateToISODate(new Date())}.csv`; a.click();
  URL.revokeObjectURL(url);
}

// Opens a print-formatted table in a new tab and triggers the browser's
// print dialog, where the person can choose "Save as PDF" — no external
// PDF library needed, works fully offline.
function exportGoatPDF(goats, finance) {
  const esc = (v) => String(v ?? '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const animalRows = goats.map(g => `
    <tr>
      <td>${esc(g.eid)}</td><td>${esc(g.name)}</td><td>${esc(g.breed)}</td>
      <td>${g.gender === 'female' ? 'Female' : 'Male'}</td><td>${esc(g.dob)}</td>
      <td>${esc(g.status)}</td><td>${esc(g.yard)}</td>
      <td>${esc(performanceVerdict(g).label)}</td>
    </tr>`).join('');
  const financeRows = (finance || []).map(r => `
    <tr><td>${esc(r.date)}</td><td>${esc(r.kind)}</td><td>${esc(r.category)}</td><td>₹${esc(r.amount)}</td><td>${esc(r.note)}</td></tr>`).join('');
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>EID Tracker export</title>
    <style>
      body{font-family:Arial,sans-serif;padding:20px;color:#111;}
      h1{font-size:18px;} h2{font-size:15px;margin-top:28px;}
      table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
      th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;}
      th{background:#f3f4f6;}
    </style></head><body>
    <h1>EID Tracker — Herd &amp; Finance Export</h1>
    <div>${new Date().toLocaleString()}</div>
    <h2>Animals (${goats.length})</h2>
    <table><thead><tr><th>EID</th><th>Name</th><th>Breed</th><th>Gender</th><th>DOB</th><th>Status</th><th>Yard</th><th>Verdict</th></tr></thead>
    <tbody>${animalRows}</tbody></table>
    <h2>Finance (${(finance||[]).length} entries)</h2>
    <table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Amount</th><th>Note</th></tr></thead>
    <tbody>${financeRows}</tbody></table>
    <script>window.onload = () => setTimeout(() => window.print(), 300);<\/script>
    </body></html>`;
  const win = window.open('', '_blank');
  if (!win) { alert('Please allow pop-ups to export as PDF.'); return; }
  win.document.write(html);
  win.document.close();
}

function TagPurchase({ profile, orders, onPlaceOrder, onUpdateOrder, onBack, locked, onUnlock, onLogout }) {
  // step: list -> form -> pack -> payment -> success | track
  const hasOrders = orders && orders.length > 0;
  const [step, setStep] = useState(hasOrders ? 'list' : 'form');
  const [trackOrder, setTrackOrder] = useState(null);

  const [name, setName] = useState(profile?.ownerName || '');
  const [addressLine, setAddressLine] = useState('');
  const [pincode, setPincode] = useState('');
  const [district, setDistrict] = useState('');
  const [stateName, setStateName] = useState('');
  const [pinLookupStatus, setPinLookupStatus] = useState(''); // '' | 'looking' | 'ok' | 'error'
  const [mobile, setMobile] = useState(profile?.mobile || '');
  const [formError, setFormError] = useState('');

  // Pack selection (the "Select EID Ear Tag Pack" page shown after the
  // delivery-details form): which pack is chosen, and the editable
  // quantity typed inside that pack's card.
  const [selectedPackId, setSelectedPackId] = useState(TAG_PACKS[0].id);
  const [qtyInput, setQtyInput] = useState(String(TAG_PACKS[0].min));
  const [packError, setPackError] = useState('');

  const [paymentMethod, setPaymentMethod] = useState('upi');
  const [payError, setPayError] = useState('');
  const [paying, setPaying] = useState(false);
  // 'idle' | 'awaiting_backend_confirmation' | 'confirmed' | 'failed'
  const [paymentStatus, setPaymentStatus] = useState('idle');
  // Manual UPI fallback (used while PAYMENT_BACKEND_URL / Razorpay isn't live yet)
  const [manualTxnId, setManualTxnId] = useState('');

  const [newOrder, setNewOrder] = useState(null);

  const selectedPack = TAG_PACKS.find((p) => p.id === selectedPackId) || TAG_PACKS[0];
  const qty = parseInt(qtyInput, 10);
  const qtyValid = qtyInput !== '' && !Number.isNaN(qty) && qty >= selectedPack.min && qty <= selectedPack.max;
  const tagsCost = qtyValid ? qty * selectedPack.pricePerUnit : 0;
  const deliveryCharge = selectedPack.deliveryCharge;
  const total = tagsCost + (qtyValid ? deliveryCharge : 0);

  const choosePack = (packId) => {
    const pack = TAG_PACKS.find((p) => p.id === packId);
    setSelectedPackId(packId);
    setPackError('');
    // Reset the quantity to that pack's minimum whenever the person
    // switches packs, so a leftover value from the other tier can't sit
    // outside the new pack's valid range.
    setQtyInput(String(pack.min));
  };

  // Tries to auto-fill district/state from a 6-digit PIN code using India
  // Post's public API. This is just a convenience — if it fails (no
  // internet, API down, blocked by the browser) the person can still type
  // the district/state in themselves; it never blocks the order.
  const lookupPincode = (pin) => {
    if (!/^\d{6}$/.test(pin)) { setPinLookupStatus(''); return; }
    setPinLookupStatus('looking');
    fetch(`https://api.postalpincode.in/pincode/${pin}`)
      .then((r) => r.json())
      .then((data) => {
        const po = data && data[0] && data[0].Status === 'Success' ? data[0].PostOffice?.[0] : null;
        if (po) {
          setDistrict(po.District || '');
          setStateName(po.State || '');
          setPinLookupStatus('ok');
        } else {
          setPinLookupStatus('error');
        }
      })
      .catch(() => { setPinLookupStatus('error'); });
  };

  const goToForm = () => { setStep('form'); setFormError(''); };

  const submitForm = () => {
    if (!name.trim()) return setFormError('Enter the name.');
    if (!addressLine.trim()) return setFormError('Enter the house/street/village address.');
    if (!/^\d{6}$/.test(pincode)) return setFormError('Enter a valid 6-digit PIN code.');
    if (!district.trim()) return setFormError('Enter the district.');
    if (!stateName.trim()) return setFormError('Enter the state.');
    if (!/^\d{10}$/.test(mobile.replace(/\D/g, ''))) return setFormError('Enter a valid 10-digit mobile number.');
    setFormError('');
    setStep('pack');
  };

  const submitPack = () => {
    if (!qtyValid) {
      return setPackError(`Enter a quantity between ${selectedPack.min} and ${selectedPack.max} tags for this pack.`);
    }
    setPackError('');
    setStep('payment');
  };

  // Waits for OUR OWN backend to confirm the payment (via Razorpay's
  // signed webhook — see razorpay-webhook.js) before trusting it. We do
  // NOT mark the order confirmed just because the checkout popup said
  // "success" — that callback runs in the customer's browser and isn't
  // proof by itself that money actually moved.
  const pollForPaymentConfirmation = async (razorpayOrderId, orderDraft) => {
    setPaymentStatus('awaiting_backend_confirmation');
    const maxAttempts = 15; // ~30s of polling — webhooks usually land in 1-3s
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      await new Promise((r) => setTimeout(r, 2000));
      try {
        const res = await fetch(`${PAYMENT_BACKEND_URL}/api/order-status?order_id=${encodeURIComponent(razorpayOrderId)}`);
        const data = await res.json();
        if (data && data.paid) {
          const order = {
            ...orderDraft,
            status: 'confirmed',
            razorpayOrderId,
            razorpayPaymentId: data.details?.payment_id || null,
            placedAt: new Date().toISOString(),
          };
          setPaying(false);
          setPaymentStatus('confirmed');
          onPlaceOrder(order);
          setNewOrder(order);
          setStep('success');
          return;
        }
      } catch (e) {
        // network hiccup — keep polling, don't fail immediately
      }
    }
    // Ran out of attempts without a confirmed payment: do NOT place the
    // order. Nothing was saved — the customer can retry.
    setPaying(false);
    setPaymentStatus('failed');
    setPayError('We could not confirm your payment yet. If money was deducted, it will confirm shortly — otherwise please try again.');
  };

  const startPayment = () => {
    if (!PAYMENT_BACKEND_URL) {
      setPayError('Payment is not set up yet — PAYMENT_BACKEND_URL needs to be configured (see eid-tracker-backend/README.md).');
      return;
    }
    if (!window.Razorpay) {
      setPayError('Payment could not load. Check your internet connection and try again.');
      return;
    }
    setPayError('');
    setPaying(true);
    setPaymentStatus('idle');

    const localId = `order_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    const orderDraft = {
      id: localId,
      trackingId: generateTrackingId(),
      name: name.trim(),
      address: `${addressLine.trim()}, ${district}, ${stateName} - ${pincode}`,
      mobile: mobile.replace(/\D/g, ''),
      quantity: qty,
      pricePerUnit: selectedPack.pricePerUnit,
      deliveryCharge,
      totalPrice: total,
      paymentMethod: 'razorpay',
    };

    fetch(`${PAYMENT_BACKEND_URL}/api/create-order`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: total, receipt: localId }),
    })
      .then((r) => r.json())
      .then((data) => {
        if (!data || !data.ok) throw new Error(data?.error || 'Could not start payment');

        const rzp = new window.Razorpay({
          key: data.key_id,
          amount: data.amount,
          currency: data.currency,
          order_id: data.order_id,
          name: GOAT_TRACKER_PAYEE_NAME,
          description: `${qty} ear tags`,
          // Prefilling BOTH contact and email (and setting method: 'card')
          // is Razorpay's documented way to skip its own "enter mobile
          // number" contact-details screen and land the customer directly
          // on the card/UPI/netbanking payment picker instead.
          prefill: {
            name: name.trim(),
            contact: mobile.replace(/\D/g, ''),
            email: (profile?.email || '').trim() || 'customer@eidtracker.app',
            method: 'card',
          },
          readonly: { contact: true, email: true },
          handler: (response) => {
            // Razorpay's popup completed and handed back a payment_id +
            // signature. We send these to OUR OWN backend, which
            // recomputes the signature with the Key Secret — only if it
            // matches do we treat the payment as real (this is Razorpay's
            // standard signature verification, no webhook required).
            fetch(`${PAYMENT_BACKEND_URL}/api/verify-payment`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                razorpay_order_id: response.razorpay_order_id,
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_signature: response.razorpay_signature,
              }),
            })
              .then((r) => r.json())
              .then((result) => {
                if (result && result.verified) {
                  pollForPaymentConfirmation(data.order_id, orderDraft);
                } else {
                  setPaying(false);
                  setPaymentStatus('failed');
                  setPayError('Payment could not be verified — order was not placed. Please try again or contact support.');
                }
              })
              .catch(() => {
                setPaying(false);
                setPaymentStatus('failed');
                setPayError('Could not verify payment — order was not placed. Please try again.');
              });
          },
          modal: {
            ondismiss: () => {
              setPaying(false);
              setPaymentStatus('idle');
              setPayError('Payment cancelled — order was not placed.');
            },
          },
        });
        rzp.on('payment.failed', () => {
          setPaying(false);
          setPaymentStatus('failed');
          setPayError('Payment failed — order was not placed. Please try again.');
        });
        rzp.open();
      })
      .catch((err) => {
        setPaying(false);
        setPaymentStatus('failed');
        setPayError(err.message || 'Could not start payment. Please try again.');
      });
  };

  // Manual UPI: customer scans the real QR (your real bank account), pays
  // outside the app, then types in the UPI transaction reference number
  // they got as proof. Since there's no backend to cross-check that
  // reference number against your bank automatically, the order is
  // confirmed right away on submission — the reference number is stored
  // on the order for your own records if you want to double check it
  // later, but it no longer blocks the customer from proceeding.
  const submitManualPayment = () => {
    if (!manualTxnId.trim() || manualTxnId.trim().length < 6) {
      setPayError('Enter the UPI transaction / reference number you received after paying.');
      return;
    }
    setPayError('');
    const order = {
      id: `order_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
      trackingId: generateTrackingId(),
      name: name.trim(),
      address: `${addressLine.trim()}, ${district}, ${stateName} - ${pincode}`,
      mobile: mobile.replace(/\D/g, ''),
      quantity: qty,
      pricePerUnit: selectedPack.pricePerUnit,
      deliveryCharge,
      totalPrice: total,
      paymentMethod: 'upi_manual',
      manualTxnId: manualTxnId.trim(),
      status: 'confirmed',
      placedAt: new Date().toISOString(),
    };
    onPlaceOrder(order);
    setNewOrder(order);
    setStep('success');
  };

  const openTracking = (order) => { setTrackOrder(order); setStep('track'); };



  const startNewOrder = () => {
    setSelectedPackId(TAG_PACKS[0].id);
    setQtyInput(String(TAG_PACKS[0].min));
    setPackError('');
    setPaymentMethod('upi');
    setPaymentStatus('idle');
    setPayError('');
    setManualTxnId('');
    setNewOrder(null);
    setStep('form');
  };

  let backAction = null;
  if (step === 'form') backAction = hasOrders ? () => setStep('list') : (onBack || null);
  else if (step === 'pack') backAction = () => setStep('form');
  else if (step === 'payment') backAction = () => setStep('pack');
  else if (step === 'track') backAction = () => setStep('list');
  else if (step === 'list') backAction = onBack || null;

  return (
    <div className="utility-page">
      <div className="utility-page-header">
        {backAction ? (
          <button className="icon-btn" onClick={backAction}><ChevronLeft size={20} /></button>
        ) : (
          <div style={{ width: 36 }} />
        )}
        <div className="sheet-title">
          {step === 'list' && 'Ear tag orders'}
          {step === 'form' && 'Buy ear tags'}
          {step === 'pack' && 'Select EID Ear Tag Pack'}
          {step === 'payment' && 'Payment'}
          {step === 'success' && 'Order placed'}
          {step === 'track' && 'Track order'}
        </div>
        {locked && onLogout ? (
          <button className="icon-btn" title="Logout" onClick={onLogout}>↪</button>
        ) : (
          <div style={{ width: 36 }} />
        )}
      </div>

      <div className="utility-page-body">
        {locked && step === 'form' && (
          <div className="tag-lock-banner">
            <Tag size={16} />
            <span>Buy your first batch of ear tags to unlock the Farm Dashboard.</span>
          </div>
        )}

        {step === 'list' && (
          <div className="tag-orders-list">
            <button className="primary-btn tag-new-order-btn" onClick={startNewOrder}>
              <Plus size={16} /> New tag order
            </button>
            {orders.slice().reverse().map((o) => {
              if (o.status === 'pending_verification') {
                return (
                  <div key={o.id} className="tag-order-card" style={{ cursor: 'default' }}>
                    <div className="tag-order-card-top">
                      <span className="mono tag-order-id">{o.trackingId}</span>
                      <span className="tag-status-pill">Pending verification</span>
                    </div>
                    <div className="tag-order-card-mid">{o.quantity} tags · ₹{o.totalPrice}</div>
                    <div className="tag-order-card-date">
                      Submitted {new Date(o.placedAt).toLocaleDateString()} · Ref: {o.manualTxnId || '—'}
                    </div>
                    {onUpdateOrder && (
                      <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
                        <button
                          className="primary-btn small"
                          style={{ flex: 1 }}
                          onClick={(e) => { e.stopPropagation(); onUpdateOrder(o.id, { status: 'confirmed' }); }}
                        >
                          Mark as paid
                        </button>
                        <button
                          className="ghost-btn small"
                          style={{ flex: 1 }}
                          onClick={(e) => { e.stopPropagation(); onUpdateOrder(o.id, { status: 'cancelled' }); }}
                        >
                          Cancel order
                        </button>
                      </div>
                    )}
                    <div className="muted" style={{ fontSize: 11, marginTop: 6 }}>
                      Check your Fino app/passbook for this amount before marking as paid.
                    </div>
                  </div>
                );
              }
              if (o.status === 'cancelled') {
                return (
                  <div key={o.id} className="tag-order-card" style={{ cursor: 'default', opacity: 0.6 }}>
                    <div className="tag-order-card-top">
                      <span className="mono tag-order-id">{o.trackingId}</span>
                      <span className="tag-status-pill">Cancelled</span>
                    </div>
                    <div className="tag-order-card-mid">{o.quantity} tags · ₹{o.totalPrice}</div>
                    <div className="tag-order-card-date">Submitted {new Date(o.placedAt).toLocaleDateString()} — payment not received</div>
                  </div>
                );
              }
              const progress = getTagOrderProgress(o);
              return (
                <button key={o.id} className="tag-order-card" onClick={() => openTracking(o)}>
                  <div className="tag-order-card-top">
                    <span className="mono tag-order-id">{o.trackingId}</span>
                    <span className={`tag-status-pill ${progress.delivered ? 'tag-status-done' : ''}`}>{progress.stepLabel}</span>
                  </div>
                  <div className="tag-order-card-mid">{o.quantity} tags · ₹{o.totalPrice}</div>
                  <div className="tag-order-card-date">Placed {new Date(o.placedAt).toLocaleDateString()}</div>
                </button>
              );
            })}
          </div>
        )}

        {step === 'form' && (
          <div className="tag-form">
            <div className="tag-info-banner">
              <Tag size={16} />
              <span>Ear tag pricing depends on quantity — you'll pick a pack and quantity on the next page.</span>
            </div>

            <label className="field">
              <span>Full name</span>
              <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Name" />
            </label>

            <label className="field">
              <span>House / street / village</span>
              <textarea rows={2} value={addressLine} onChange={(e) => setAddressLine(e.target.value)} placeholder="House no., street, village" />
            </label>

            <label className="field">
              <span>PIN code</span>
              <input
                inputMode="numeric"
                value={pincode}
                onChange={(e) => {
                  const v = e.target.value.replace(/\D/g, '').slice(0, 6);
                  setPincode(v);
                  if (v.length === 6) lookupPincode(v); else setPinLookupStatus('');
                }}
                placeholder="6-digit PIN code"
              />
            </label>

            {pinLookupStatus === 'looking' && <div className="muted" style={{ fontSize: 13 }}>Looking up district/state…</div>}
            {pinLookupStatus === 'error' && <div className="muted" style={{ fontSize: 13 }}>Couldn't auto-detect district/state — please enter them below.</div>}

            <div style={{ display: 'flex', gap: 10 }}>
              <label className="field" style={{ flex: 1 }}>
                <span>District</span>
                <input value={district} onChange={(e) => setDistrict(e.target.value)} placeholder="District" />
              </label>
              <label className="field" style={{ flex: 1 }}>
                <span>State</span>
                <input value={stateName} onChange={(e) => setStateName(e.target.value)} placeholder="State" />
              </label>
            </div>

            <label className="field">
              <span>Mobile number</span>
              <input
                inputMode="numeric"
                value={mobile}
                onChange={(e) => setMobile(e.target.value.replace(/\D/g, '').slice(0, 10))}
                placeholder="10-digit mobile number"
              />
            </label>

            {formError && <div className="form-error"><AlertCircle size={14} /> {formError}</div>}

            <button className="primary-btn" onClick={submitForm}>
              Continue to select tag pack
            </button>
          </div>
        )}

        {step === 'pack' && (
          <div className="tag-form">
            <div className="tag-info-banner">
              <Tag size={16} />
              <span>Official ISO 11784/11785 livestock microchips. Choose a pack, then set your exact quantity.</span>
            </div>

            {TAG_PACKS.map((pack) => {
              const isSelected = pack.id === selectedPackId;
              return (
                <div
                  key={pack.id}
                  className={`tag-pack-card${isSelected ? ' tag-pack-card-selected' : ''}`}
                  onClick={() => choosePack(pack.id)}
                >
                  <div className="tag-pack-card-top">
                    <div className="tag-pack-card-radio">
                      <span className={`tag-pack-radio-dot${isSelected ? ' tag-pack-radio-dot-on' : ''}`} />
                      <span className="tag-pack-card-label">{pack.label}</span>
                    </div>
                    <span className="tag-pack-card-price">₹{pack.pricePerUnit}/tag</span>
                  </div>
                  <div className="tag-pack-card-blurb">{pack.blurb}</div>
                  <ul className="tag-pack-features">
                    {pack.features.map((f) => (
                      <li key={f}><CheckCircle2 size={13} /> <span>{f}</span></li>
                    ))}
                  </ul>
                  <div className="tag-pack-card-detail">
                    <CheckCircle2 size={13} />
                    <span>{pack.deliveryCharge === 0 ? 'Free delivery' : `+ ₹${pack.deliveryCharge} delivery charge`}</span>
                  </div>

                  {isSelected && (
                    <div className="tag-pack-qty-row" onClick={(e) => e.stopPropagation()}>
                      <span>Quantity</span>
                      <input
                        className="tag-pack-qty-input"
                        inputMode="numeric"
                        value={qtyInput}
                        onChange={(e) => { setPackError(''); setQtyInput(e.target.value.replace(/\D/g, '').slice(0, 5)); }}
                        placeholder={`${pack.min}-${pack.max}`}
                      />
                      <span className="muted" style={{ fontSize: 12 }}>({pack.min}–{pack.max})</span>
                    </div>
                  )}
                </div>
              );
            })}

            {packError && <div className="form-error"><AlertCircle size={14} /> {packError}</div>}

            {qtyValid && (
              <div className="tag-price-box">
                <div className="tag-price-row">
                  <span>{qty} tags × ₹{selectedPack.pricePerUnit}</span>
                  <span className="mono">₹{tagsCost}</span>
                </div>
                <div className="tag-price-row">
                  <span>Delivery charge</span>
                  {deliveryCharge === 0 ? (
                    <span className="mono" style={{ color: '#16a34a', fontWeight: 700 }}>FREE</span>
                  ) : (
                    <span className="mono">+ ₹{deliveryCharge}</span>
                  )}
                </div>
                <div className="tag-price-row" style={{ borderTop: '1px solid #e5e7eb', marginTop: 6, paddingTop: 6 }}>
                  <span><strong>Total</strong></span>
                  <span className="mono tag-price-total">₹{total}</span>
                </div>
              </div>
            )}

            <div className="field">
              <span>Postal Delivery Address for EID Tags</span>
              <div className="tag-pack-address-box">{addressLine}, {district}, {stateName} - {pincode}</div>
            </div>

            <button className="primary-btn" disabled={!qtyValid} onClick={submitPack} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
              <ShoppingCart size={16} /> Proceed to UPI Payment{qtyValid ? ` (₹${total})` : ''}
            </button>
          </div>
        )}

        {step === 'payment' && (
          <div className="tag-form">
            <div className="tag-price-box tag-payment-summary">
              <div className="tag-price-row">
                <span>{qty} tags to {name}</span>
                <span className="mono">₹{tagsCost}</span>
              </div>
              <div className="tag-price-row">
                <span>Delivery</span>
                <span className="mono">{deliveryCharge === 0 ? 'FREE' : `₹${deliveryCharge}`}</span>
              </div>
              <div className="tag-price-row" style={{ borderTop: '1px solid #e5e7eb', marginTop: 6, paddingTop: 6 }}>
                <span><strong>Total</strong></span>
                <span className="mono tag-price-total">₹{total}</span>
              </div>
            </div>

            {PAYMENT_BACKEND_URL ? (
              <>
                <div className="tag-upi-note" style={{ textAlign: 'center', margin: '4px 0 10px' }}>
                  Tap below to pay securely by UPI, card, or netbanking. Your order is confirmed automatically only after the payment is verified.

            <div className="tag-success-icon"><ShieldCheck size={30} /></div>
            <div className="tag-success-title">
              {newOrder.status === 'pending_verification' ? 'Order submitted' : 'Order placed!'}
            </div>
            <div className="tag-success-text">
              {newOrder.status === 'pending_verification'
                ? `${newOrder.quantity} ear tags · ₹${newOrder.totalPrice} — payment pending verification`

            </div>
            <div className="tag-tracking-box">
              <span>Tracking ID</span>
              <strong className="mono">{newOrder.trackingId}</strong>

              <div className="msg" style={{ background: '#fff8e6', color: '#8a6100', border: '1px solid #f0dca0', marginBottom: 10 }}>

              </div>
            )}
            {locked ? (
              newOrder.status === 'confirmed' ? (
                <button className="primary-btn" onClick={onUnlock}>Continue to Farm Dashboard</button>
              ) : (
                <div className="muted" style={{ fontSize: 12, textAlign: 'center' }}>
                  The Farm Dashboard unlocks once this payment is verified.
                </div>
              )
            ) : (
              <>
                <button className="primary-btn" onClick={() => openTracking(newOrder)}>Track this order</button>
                <button className="ghost-btn" onClick={() => setStep('list')}>Back to orders</button>
              </>
            )}
          </div>
        )}

        {step === 'track' && trackOrder && (() => {
          const progress = getTagOrderProgress(trackOrder);
          return (
            <div className="tag-track">
              <div className="tag-tracking-box tag-tracking-box-wide">
                <span>Tracking ID</span>
                <strong className="mono">{trackOrder.trackingId}</strong>
              </div>
              <div className="tag-track-meta">
                <div>{trackOrder.quantity} tags · ₹{trackOrder.totalPrice}</div>
                <div>Delivering to {trackOrder.name}, {trackOrder.address}</div>
                <div>Placed {new Date(trackOrder.placedAt).toLocaleString()}</div>
                {!progress.delivered && <div>Estimated delivery: {progress.estDelivery.toLocaleDateString()}</div>}
              </div>
              <div className="tag-track-steps">
                {TAG_ORDER_STEPS.map((s, i) => (
                  <div key={s} className={`tag-track-step ${i <= progress.stepIndex ? 'tag-track-step-done' : ''}`}>
                    <div className="tag-track-dot" />
                    <div className="tag-track-step-label">{s}</div>
                  </div>
                ))}
              </div>
            </div>
          );
        })()}
      </div>
    </div>
  );
}

function AccountDetails({ profile, onBack, onSaveNames, onMobileChanged }) {
  const [farmName, setFarmName] = useState(profile.farmName || '');
  const [ownerName, setOwnerName] = useState(profile.ownerName || '');
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState('');

  const [changingMobile, setChangingMobile] = useState(false);
  const [newMobile, setNewMobile] = useState('');
  const [confirmStep, setConfirmStep] = useState(false);
  const [currentPin, setCurrentPin] = useState('');
  const [mobileError, setMobileError] = useState('');
  const [migrating, setMigrating] = useState(false);

  const [changingPin, setChangingPin] = useState(false);
  const [pinCurrent, setPinCurrent] = useState('');
  const [pinNew, setPinNew] = useState('');
  const [pinConfirm, setPinConfirm] = useState('');
  const [pinError, setPinError] = useState('');
  const [pinSaved, setPinSaved] = useState(false);

  const saveNames = () => {
    if (!farmName.trim()) return setError('Enter farm name.');
    if (!ownerName.trim()) return setError('Enter owner name.');
    const res = onSaveNames({ farmName: farmName.trim(), ownerName: ownerName.trim() });
    if (!res.ok) return setError(res.error || 'Could not save.');
    setError('');
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  const proceedToConfirm = () => {
    const res = window.__authValidateNewMobile(newMobile);
    if (!res.ok) return setMobileError(res.error);
    setMobileError('');
    setConfirmStep(true);
  };

  const confirmMobileChange = async () => {
    const check = window.__authCheckPin(profile.mobile, currentPin.trim());
    if (!check.ok) return setMobileError(check.error);
    setMobileError('');
    setMigrating(true);
    await onMobileChanged(newMobile.replace(/\D/g, ''));
    setMigrating(false);
    setChangingMobile(false);
    setConfirmStep(false);
    setCurrentPin('');
    setNewMobile('');
  };

  const submitPinChange = () => {
    if (!/^\d{4}$/.test(pinNew)) { setPinError('New PIN must be exactly 4 digits.'); return; }
    if (pinNew !== pinConfirm) { setPinError('New PIN and confirmation do not match.'); return; }
    const res = window.__authChangePin(profile.mobile, pinCurrent.trim(), pinNew);
    if (!res.ok) { setPinError(res.error); return; }
    setPinError('');
    setPinSaved(true);
    setPinCurrent(''); setPinNew(''); setPinConfirm('');
    setTimeout(() => { setPinSaved(false); setChangingPin(false); }, 1200);
  };

  return (
    <div className="utility-page">
      <div className="utility-page-header">
        <button className="icon-btn" onClick={onBack}><ChevronLeft size={20} /></button>
        <div className="sheet-title">Account details</div>
        <div style={{ width: 36 }} />
      </div>
      <div className="utility-page-body">
        <label className="field">
          <span>Farm name</span>
          <input value={farmName} onChange={(e) => setFarmName(e.target.value)} placeholder="Your farm name" />
        </label>
        <label className="field">
          <span>Owner name</span>
          <input value={ownerName} onChange={(e) => setOwnerName(e.target.value)} placeholder="Owner name" />
        </label>
        {error && <div className="form-error"><AlertCircle size={14} /> {error}</div>}
        <button className="primary-btn" onClick={saveNames}>{saved ? 'Saved ✓' : 'Save changes'}</button>

        <div style={{ height: 1, background: '#e5e7eb', margin: '22px 0' }} />

        <label className="field">
          <span>Mobile number</span>
          <input value={`+91 ${profile.mobile}`} readOnly />
        </label>

        {!changingMobile ? (
          <button className="ghost-btn" onClick={() => setChangingMobile(true)}>Change mobile number</button>
        ) : !confirmStep ? (
          <>
            <label className="field">
              <span>New mobile number</span>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                <span style={{ padding: '11px 10px', background: '#f1f1f1', borderRadius: 8, fontWeight: 600 }}>+91</span>
                <input
                  style={{ flex: 1 }}
                  inputMode="numeric"
                  value={newMobile}
                  onChange={(e) => setNewMobile(e.target.value.replace(/\D/g, '').slice(0, 10))}
                  placeholder="10-digit new mobile"
                />
              </div>
            </label>
            {mobileError && <div className="form-error"><AlertCircle size={14} /> {mobileError}</div>}
            <button className="primary-btn" onClick={proceedToConfirm}>Continue</button>
            <button className="ghost-btn" onClick={() => { setChangingMobile(false); setMobileError(''); }}>Cancel</button>
          </>
        ) : (
          <>
            <div className="muted">Enter your current PIN to confirm switching to +91 {newMobile}</div>
            <label className="field">
              <span>Current 4-digit PIN</span>
              <input inputMode="numeric" maxLength={4} value={currentPin} onChange={(e) => setCurrentPin(e.target.value.replace(/\D/g, '').slice(0, 4))} placeholder="1234" />
            </label>
            {mobileError && <div className="form-error"><AlertCircle size={14} /> {mobileError}</div>}
            <button className="primary-btn" disabled={migrating} onClick={confirmMobileChange}>
              {migrating ? 'Updating account…' : 'Confirm & update number'}
            </button>
            <button className="ghost-btn" onClick={() => { setConfirmStep(false); setCurrentPin(''); }}>← Back</button>
          </>
        )}

        <div style={{ height: 1, background: '#e5e7eb', margin: '22px 0' }} />

        {!changingPin ? (
          <button className="ghost-btn" onClick={() => setChangingPin(true)}>Change password (PIN)</button>
        ) : (
          <>
            <label className="field">
              <span>Current PIN</span>
              <input inputMode="numeric" maxLength={4} value={pinCurrent} onChange={(e) => setPinCurrent(e.target.value.replace(/\D/g, '').slice(0, 4))} placeholder="1234" />
            </label>
            <label className="field">
              <span>New 4-digit PIN</span>
              <input inputMode="numeric" maxLength={4} value={pinNew} onChange={(e) => setPinNew(e.target.value.replace(/\D/g, '').slice(0, 4))} placeholder="1234" />
            </label>
            <label className="field">
              <span>Confirm new PIN</span>
              <input inputMode="numeric" maxLength={4} value={pinConfirm} onChange={(e) => setPinConfirm(e.target.value.replace(/\D/g, '').slice(0, 4))} placeholder="1234" />
            </label>
            {pinError && <div className="form-error"><AlertCircle size={14} /> {pinError}</div>}
            <button className="primary-btn" onClick={submitPinChange}>{pinSaved ? 'Password changed ✓' : 'Save new password'}</button>
            <button className="ghost-btn" onClick={() => { setChangingPin(false); setPinError(''); setPinCurrent(''); setPinNew(''); setPinConfirm(''); }}>Cancel</button>
          </>
        )}
      </div>
    </div>
  );
}

function TagQRCode({ value, size = 168 }) {
  let h = 0;
  for (let i = 0; i < value.length; i++) h = (h * 31 + value.charCodeAt(i)) >>> 0;
  const grid = 12;
  const cells = [];
  let seed = h || 1;
  const rand = () => { seed = (seed * 1103515245 + 12345) >>> 0; return (seed >>> 8) / 16777216; };
  for (let r = 0; r < grid; r++) {
    for (let c = 0; c < grid; c++) {
      const onEdge = r < 3 && c < 3 || r < 3 && c > grid - 4 || r > grid - 4 && c < 3;
      if (onEdge) continue;
      if (rand() > 0.55) cells.push([r, c]);
    }
  }
  const cell = size / grid;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="tag-qr-svg">
      <rect x="0" y="0" width={size} height={size} fill="#fff" rx="10" />
      {[[0, 0], [grid - 3, 0], [0, grid - 3]].map(([r, c], i) => (
        <g key={i}>
          <rect x={c * cell} y={r * cell} width={cell * 3} height={cell * 3} fill="none" stroke="#2B2419" strokeWidth={cell * 0.5} />
          <rect x={(c + 1) * cell} y={(r + 1) * cell} width={cell} height={cell} fill="#2B2419" />
        </g>
      ))}
      {cells.map(([r, c], i) => (
        <rect key={i} x={c * cell} y={r * cell} width={cell} height={cell} fill="#2B2419" />
      ))}
    </svg>
  );
}

function GoatEIDTracker({ mobile, farmName, ownerName, email, onLogout, isNewUser }) {
  const [currentMobile, setCurrentMobile] = useState(mobile);
  const [farmNameState, setFarmNameState] = useState(farmName || 'My Farm');
  const [ownerNameState, setOwnerNameState] = useState(ownerName || '');
  const profile = { mobile: currentMobile, farmName: farmNameState || 'My Farm', ownerName: ownerNameState || '', email: email || '', loggedIn: true };
  const { goats, loading, error, persist } = useHerdStorage(currentMobile);
  const { finance, persistFinance } = useFinanceStorage(currentMobile);
  const { milkSales, milkSalesLoading, persistMilkSales } = useMilkSalesStorage(currentMobile);
  const { milkEntries, milkEntriesLoading, persistMilkEntries } = useMilkEntriesStorage(currentMobile);
  const { orders: tagOrders, ordersLoading: tagOrdersLoading, persistOrders: persistTagOrders } = useTagOrders(currentMobile);
  const [view, setView] = useState('home'); // home | listing | detail | form | finance | yard | milk | tagpurchase | account
  const [selectedId, setSelectedId] = useState(null);
  const [editing, setEditing] = useState(null);
  const [query, setQuery] = useState('');
  const [statusFilter, setStatusFilter] = useState('active');
  const [speciesFilter, setSpeciesFilter] = useState('all');
  const [listPage, setListPage] = useState(1);
  const PAGE_SIZE = 24;
  const [yardFilter, setYardFilter] = useState('all');
  const [scannerOpen, setScannerOpen] = useState(false);
  const [scannerMode, setScannerMode] = useState('open');
  const [financeOpen, setFinanceOpen] = useState(false);
  const [yardOpen, setYardOpen] = useState(false);
  const [scannerTarget, setScannerTarget] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [tagsLocked, setTagsLocked] = useState(null); // null = unknown, true = must buy tags first
  const isPoppingRef = useRef(false);

  // Makes the phone's back button (or a browser's back gesture) step back
  // through in-app screens instead of exiting the app straight away. Every
  // screen change pushes a history entry; going back pops it and restores
  // the previous screen. Only once there's nothing left to pop does the
  // back button fall through to the normal "exit app" behaviour.
  //
  // Some embedded/sandboxed contexts (e.g. preview iframes) block the
  // History API entirely and throw on pushState/replaceState — safePush
  // swallows that so the app keeps working there, just without the
  // back-button shortcut.
  const safePush = (view) => {
    try { window.history.pushState({ __eidView: view }, '', '#' + view); } catch { /* history API unavailable here */ }
  };
  const safeReplace = (view) => {
    try { window.history.replaceState({ __eidView: view }, '', '#' + view); } catch { /* history API unavailable here */ }
  };

  useEffect(() => {
    if (isPoppingRef.current) { isPoppingRef.current = false; return; }
    safePush(view);
  }, [view]);

  useEffect(() => {
    safeReplace('home');
    const handler = () => {
      if (scannerOpen) { setScannerOpen(false); safePush(view); return; }
      if (menuOpen) { setMenuOpen(false); safePush(view); return; }
      isPoppingRef.current = true;
      setView((window.history.state && window.history.state.__eidView) || 'home');
    };
    window.addEventListener('popstate', handler);
    return () => window.removeEventListener('popstate', handler);
  }, [scannerOpen, menuOpen, view]);

  useEffect(() => {
    if (!currentMobile) { setTagsLocked(null); return; }
    if (!tagOrdersLoading && tagOrders !== null) {
      // Locked until at least one tag order is actually CONFIRMED (payment
      // verified) — not merely placed. A "pending_verification" order
      // (manual UPI flow, owner hasn't checked the bank yet) or a
      // "cancelled" one does NOT count. Re-evaluated on every tagOrders
      // change, so the moment the owner taps "Mark as paid" on a pending
      // order, this flips to false and the Farm Dashboard unlocks
      // automatically — no separate "continue" click needed.
      setTagsLocked(!tagOrders.some((o) => o.status === 'confirmed'));
    }
  }, [currentMobile, tagOrdersLoading, tagOrders]);

  if (loading || goats === null) return <div className="loading-screen">Loading herd records…</div>;
  if (tagOrdersLoading || tagOrders === null || tagsLocked === null) return <div className="loading-screen">Loading account…</div>;

  const handlePlaceTagOrder = (order) => persistTagOrders([...(tagOrders || []), order]);
  const homeAttentionCount = countHerdAttentionItems(goats);
  // Owner-side manual verification: flips a pending_verification order to
  // confirmed (payment checked in the bank) or cancelled (never arrived).
  const handleUpdateTagOrder = (orderId, updates) =>
    persistTagOrders((tagOrders || []).map((o) => (o.id === orderId ? { ...o, ...updates } : o)));

  const handleExportBackup = () => {
    const payload = {
      kind: 'goat-tracker-backup',
      exportedAt: new Date().toISOString(),
      profile,
      goats,
      finance,
      milkSales,
      milkEntries,
      tagOrders,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `goat-tracker-backup-${profile?.mobile || 'farm'}-${dateToISODate(new Date())}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const selected = goats.find((g) => g.id === selectedId);

  const filtered = goats.filter((g) => {
    const matchesStatus = statusFilter === 'all' || g.status === statusFilter;
    const matchesYard = yardFilter === 'all' || (g.yard || '') === yardFilter;
    const matchesSpecies = speciesFilter === 'all' || (g.species || 'Goat') === speciesFilter;
    const q = query.trim().toLowerCase();
    const matchesQuery = !q ||
      String(g.eid || '').toLowerCase().includes(q) ||
      String(g.name || '').toLowerCase().includes(q) ||
      String(g.breed || '').toLowerCase().includes(q);
    return matchesStatus && matchesYard && matchesSpecies && matchesQuery;
  });

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const safePage = Math.min(listPage, totalPages);
  const visibleGoats = filtered.slice((safePage - 1) * PAGE_SIZE, safePage * PAGE_SIZE);

  const saveGoat = (goat) => {
    const exists = goats.some((g) => g.id === goat.id);
    const next = exists ? goats.map((g) => (g.id === goat.id ? goat : g)) : [...goats, goat];
    persist(next);
    setSelectedId(goat.id);
    setView('detail');
    setEditing(null);
  };

  const updateGoat = (goat) => {
    persist(goats.map((g) => (g.id === goat.id ? goat : g)));
  };

  const addGoatFromDetail = (child, updatedParent) => {
    const exists = goats.some(g => String(g.eid || '').trim().toLowerCase() === String(child.eid || '').trim().toLowerCase());

      )}

      {view === 'finance' && (
        <div className="utility-page">
          <div className="utility-page-header">
            <button className="icon-btn" onClick={() => setView('home')}><ChevronLeft size={20} /></button>
            <div className="sheet-title">Monthly financial</div>
            <div style={{width:36}} />
          </div>
          <div className="utility-page-body">
            <FinancePanel finance={finance} onChange={persistFinance} />
          </div>
        </div>
      )}

      {view === 'yard' && (
        <div className="utility-page">
          <div className="utility-page-header">
            <button className="icon-btn" onClick={() => setView('home')}><ChevronLeft size={20} /></button>
            <div className="sheet-title">Yard / pen view</div>
            <div style={{width:36}} />
          </div>
          <div className="utility-page-body">
            <YardView
              goats={goats}
              onOpenGoat={(id) => { setSelectedId(id); setView('detail'); }}
              onOpenScanner={() => { setScannerMode('open'); setScannerTarget(null); setScannerOpen(true); }}
            />
          </div>
        </div>
      )}

      {view === 'listing' && (
        <>
          <div className="app-header">
            <div className="listing-topbar">
              <button className="icon-btn" onClick={() => setView('home')}><ChevronLeft size={18} /></button>
              <div className="app-eyebrow">Animal Listing</div>
            </div>
            <div className="title-row">
              <div>
                <h1 className="app-title">EID Tracker</h1>
                <div className="farm-name-home">{profile?.farmName || 'My Farm'}</div>
              </div>
              <div className="header-actions">
                <button className="scan-header-btn" onClick={() => { setScannerMode('open'); setScannerTarget(null); setScannerOpen(true); }}><ScanLine size={17} /> Scan EID</button>
              </div>
            </div>
          </div>

          {error && <div className="error-banner"><AlertCircle size={13} /> {error}</div>}

          <HerdStats goats={goats} large />
          <KiddingReminders goats={goats} onOpenGoat={(id) => { setSelectedId(id); setView('detail'); }} />
          <div className="export-row">
            <button className="export-btn" onClick={() => exportGoatCSV(goats, finance)}><Download size={13} /> Export CSV</button>
            <button className="export-btn" onClick={() => exportGoatPDF(goats, finance)}><Download size={13} /> Export PDF</button>
          </div>

          <div className="search-row">
            <div className="search-box">
              <Search size={15} color="#5A5148" />
              <input placeholder="Search by tag, name, or breed" value={query} onChange={(e) => { setQuery(e.target.value); setListPage(1); }} />
              {query && <X size={15} color="#5A5148" style={{ cursor: 'pointer' }} onClick={() => setQuery('')} />}
            </div>
          </div>
          <div className="filter-pills">
            {['active', 'sold', 'culled', 'deceased', 'all'].map((s) => (
              <button key={s} className={`pill ${statusFilter === s ? 'pill-active' : ''}`} onClick={() => { setStatusFilter(s); setListPage(1); }}>
                {s[0].toUpperCase() + s.slice(1)}
              </button>
            ))}
          </div>
          <div className="filter-pills">
            {['all', ...ANIMAL_SPECIES].map((s) => (
              <button key={s} className={`pill ${speciesFilter === s ? 'pill-active' : ''}`} onClick={() => { setSpeciesFilter(s); setListPage(1); }}>
                {s === 'all' ? 'All species' : s}
              </button>
            ))}
          </div>

          <div className="herd-list-head">
            <div><strong>{filtered.length}</strong> {statusFilter === 'all' ? 'animals' : statusFilter + ' animals'}</div>
            {filtered.length > PAGE_SIZE && (
              <span>Showing {(safePage - 1) * PAGE_SIZE + 1}–{Math.min(safePage * PAGE_SIZE, filtered.length)}</span>
            )}
          </div>

          <div className="list-wrap">
            {filtered.length === 0 && (
              <div className="empty-list">
                {goats.length === 0 ? 'No animals yet. Tap + to tag your first animal.' : 'No animals match this search or filter.'}
              </div>
            )}
            {visibleGoats.map((g) => (
              <EarTagCard key={g.id} goat={g} onClick={() => { setSelectedId(g.id); setView('detail'); }} />
            ))}
          </div>

          {totalPages > 1 && (
            <div className="herd-pagination">
              <button className="page-btn" disabled={safePage === 1} onClick={() => setListPage(p => Math.max(1, p - 1))}>‹</button>
              <div className="page-info"><strong>{safePage}</strong><span>of {totalPages}</span></div>
              <button className="page-btn" disabled={safePage === totalPages} onClick={() => setListPage(p => Math.min(totalPages, p + 1))}>›</button>
            </div>
          )}

          <button className="fab" onClick={() => { setEditing(emptyGoat()); setView('form'); }}>
            <Plus size={24} />
          </button>
        </>
      )}

      {view === 'form' && (
        <GoatForm
          initial={editing}
          existingEids={goats}
          onSave={saveGoat}
          onCancel={() => { setView(selectedId ? 'detail' : 'listing'); setEditing(null); }}
          onOpenScanner={openFormScanner}
        />
      )}

      {view === 'detail' && selected && (
        <GoatDetail
          goat={selected}
          onBack={() => { setView('listing'); setSelectedId(null); }}
          onEdit={(g) => { setEditing(g); setView('form'); }}
          onUpdate={updateGoat}
          onDelete={deleteGoat}
          onAddGoat={addGoatFromDetail}
          herdGoats={goats}
          onOpenGoat={(id) => { setSelectedId(id); setView('detail'); }}
          onOpenScanner={openFormScanner}
        />
      )}
      {scannerOpen && (
        <EIDScanner
          goats={goats}
          mode={scannerMode}
          onSelectGoat={(id) => { setSelectedId(id); setView('detail'); setScannerOpen(false); setScannerMode('open'); }}
          onScanValue={(eid) => {
            if (scannerMode === 'field' && scannerTarget) {
              window.dispatchEvent(new CustomEvent('goat-eid-scanned', { detail: { target: scannerTarget, eid } }));
              setScannerOpen(false); setScannerMode('open'); setScannerTarget(null);
              return;
            }
            if (scannerMode === 'open') {
              // No animal exists for this tag yet — jump straight into
              // "New animal" with the scanned EID already filled in.
              setEditing({ ...emptyGoat(), eid });
              setView('form');
              setScannerOpen(false); setScannerMode('open'); setScannerTarget(null);
              return;
            }
            setScannerOpen(false); setScannerMode('open'); setScannerTarget(null);
          }}
          onClose={() => { setScannerOpen(false); setScannerMode('open'); setScannerTarget(null); }}
        />
      )}
      </>
      )}
    </div>
  );
}

class EIDErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('[EID Tracker] crashed:', error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 24, fontFamily: 'Arial, sans-serif', maxWidth: 480, margin: '40px auto' }}>
          <h2 style={{ color: '#b00020' }}>Something went wrong</h2>
          <p style={{ color: '#444' }}>The app hit an unexpected error and had to stop. Your saved data is safe — reloading should fix this.</p>
          <pre style={{ background: '#f5f5f5', padding: 10, borderRadius: 8, fontSize: 12, overflow: 'auto', whiteSpace: 'pre-wrap' }}>{String(this.state.error && this.state.error.message || this.state.error)}</pre>
          <button onClick={() => window.location.reload()} style={{ marginTop: 12, padding: '10px 16px', borderRadius: 8, border: '1px solid #171717', background: '#171717', color: '#fff', cursor: 'pointer' }}>Reload app</button>
        </div>
      );
    }
    return this.props.children;
  }
}

const goatTrackerReactRoot = ReactDOM.createRoot(document.getElementById('root'));

// Called by the login/register gate (plain JS, outside this Babel script)
// once someone is signed in. Re-callable — used again on every login/logout
// so the app always reflects the currently signed-in account.
window.__mountGoatTracker = function (mobile, farmName, ownerName, email, onLogout, isNewUser) {
  goatTrackerReactRoot.render(
    <EIDErrorBoundary>
      <GoatEIDTracker key={mobile} mobile={mobile} farmName={farmName} ownerName={ownerName} email={email} onLogout={onLogout} isNewUser={!!isNewUser} />
    </EIDErrorBoundary>
  );
};
window.__unmountGoatTracker = function () {
  goatTrackerReactRoot.render(null);
};

// The auth gate's initial render (in the plain <script> above) runs before
// this Babel script has executed, so if a session was already active it
// couldn't mount anything yet. Re-check now that __mountGoatTracker exists.
if (window.authRender) window.authRender();
</script>

<!-- PWA "new version available" banner — hidden until an update is found -->
<div id="updateBanner">
  <span>A new version of EID Tracker is available.</span>
  <button id="updateBannerBtn" type="button">Update now</button>
</div>

<script>
  // --- PWA install + auto-update detection ---------------------------------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').then((reg) => {

        function showUpdateBanner(worker) {
          const banner = document.getElementById('updateBanner');
          const btn = document.getElementById('updateBannerBtn');
          banner.style.display = 'flex';
          btn.onclick = () => {
            // Tell the new worker to take over, then reload once it does.
            worker.postMessage('SKIP_WAITING');
          };
        }

        // Case 1: an update was already waiting when this page loaded.
        if (reg.waiting) showUpdateBanner(reg.waiting);

        // Case 2: a new worker starts installing while the app is open —
        // this fires automatically because the browser periodically
        // re-checks service-worker.js for changes in the background.
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateBanner(newWorker);
            }
          });
        });
      }).catch((err) => {
        console.warn('Service worker registration failed:', err);
      });

      // Once the new worker takes control, reload so the customer gets the
      // fresh files instead of the ones already loaded in memory.
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    });
  }
</script>
